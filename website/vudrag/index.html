      const localShiftX = (pinDirectionX * (newW - startW)) / 2;
      const localShiftY = (pinDirectionY * (newH - startH)) / 2;

      const worldShiftX = localShiftX * cos - localShiftY * sin;
      const worldShiftY = localShiftX * sin + localShiftY * cos;

      const newCenterX = startX + worldShiftX;
      const newCenterY = startY + worldShiftY;

      const scaleRatio = newW / Math.max(1, startW);

      resizingGroupEntries.forEach(entry => {
        if (entry.card === resizingCard) {
          const roundedW = Math.round(newW);
          const roundedH = Math.round(newH);
          entry.card.dataset.w = roundedW;
          entry.card.dataset.h = roundedH;
          entry.card.dataset.x = newCenterX;
          entry.card.dataset.y = newCenterY;
          entry.card.dataset.customResized = 'true';
          entry.card.style.width = `${roundedW}px`;
          entry.card.style.height = `${roundedH}px`;
          entry.card.style.transform = `translate3d(${newCenterX - roundedW/2}px, ${newCenterY - roundedH/2}px, 0) rotate(${startRot}deg)`;
        } else {
          const otherW = Math.round(Math.max(100, Math.min(3200, entry.startW * scaleRatio)));
          const otherH = Math.round(Math.max(80, Math.min(3200, entry.startH * scaleRatio)));
          entry.card.dataset.w = otherW;
          entry.card.dataset.h = otherH;
          entry.card.dataset.customResized = 'true';
          entry.card.style.width = `${otherW}px`;
          entry.card.style.height = `${otherH}px`;
          entry.card.style.transform = `translate3d(${entry.startX - otherW/2}px, ${entry.startY - otherH/2}px, 0) rotate(${entry.startRot}deg)`;
        }
      });

      const ratioBadge = snappedTarget ? ` · ${snappedTarget.label} ✦` : '';
      showToast(`${Math.round(newW)} × ${Math.round(newH)} px${ratioBadge}`);
    }

    function onCardResizeMouseUp() {
      if (!isResizingCard) return;

      window.removeEventListener('mousemove', onCardResizeMouseMove);
      window.removeEventListener('mouseup', onCardResizeMouseUp);

      if (resizingCard) {
        resizingCard.classList.remove('is-resizing');
        resizingCard.classList.remove('is-aspect-snapped');
      }
      document.body.classList.remove('is-resizing');
      document.body.style.cursor = '';

      const card = resizingCard;
      isResizingCard = false;
      resizingCard = null;
      activeHandleType = null;
      primaryResizeEntry = null;
      wasSnapped = false;

      if (card) {
        savePositions(true);
        recordBoardChange(resizeStartSnapshot);
        const natural = Number(card.dataset.naturalAspect);
        const curRatio = Number(card.dataset.w) / Math.max(1, Number(card.dataset.h));
        const matchedStd = [
          { r: 16/9, l: '16:9' }, { r: 4/3, l: '4:3' }, { r: 1/1, l: '1:1' },
          { r: 3/2, l: '3:2' }, { r: 2/3, l: '2:3' }, { r: 9/16, l: '9:16' }
        ].find(s => Math.abs(s.r - curRatio) / s.r < 0.02);
        const tag = matchedStd ? ` (${matchedStd.l})` : '';
        showToast(`Size: ${Math.round(card.dataset.w)} × ${Math.round(card.dataset.h)}${tag}`);
      }
      resizeStartSnapshot = null;
      resizingGroupEntries = [];
    }

    function scaleSelectedCards(factor) {
      const cards = getSelectedCards();
      if (!cards.length) {
        showToast('Select media first');
        return;
      }
      finishPendingFling();
      const before = captureBoardSnapshot();

      cards.forEach(card => {
        const curW = Number(card.dataset.w || 320);
        const curH = Number(card.dataset.h || 240);
        const x = Number(card.dataset.x || 0);
        const y = Number(card.dataset.y || 0);
        const rot = Number(card.dataset.rot || 0);

        const newW = Math.round(Math.max(100, Math.min(3200, curW * factor)));
        const newH = Math.round(Math.max(80, Math.min(3200, curH * factor)));

        card.dataset.w = newW;
        card.dataset.h = newH;
        card.dataset.customResized = 'true';
        card.style.width = `${newW}px`;
        card.style.height = `${newH}px`;
        card.style.transform = `translate3d(${x - newW/2}px, ${y - newH/2}px, 0) rotate(${rot}deg)`;
      });

      savePositions(true);
      recordBoardChange(before);
      const first = cards[0];
      showToast(`Size: ${first.dataset.w} × ${first.dataset.h}`);
    }

    function resetSelectedCardsSize() {
      const cards = getSelectedCards();
      if (!cards.length) {
        showToast('Select media first');
        return;
      }
      finishPendingFling();
      const before = captureBoardSnapshot();

      cards.forEach(card => {
        const type = card.dataset.type || 'image';
        let defaultW = type === 'video' ? 440 : (type === 'link' ? 360 : 320);
        let defaultH = type === 'video' ? 260 : (type === 'link' ? 240 : 380);

        const img = card.querySelector('img');
        if (img && img.naturalWidth && img.naturalHeight) {
          defaultH = Math.round(defaultW * (img.naturalHeight / img.naturalWidth));
        }

        const x = Number(card.dataset.x || 0);
        const y = Number(card.dataset.y || 0);
        const rot = Number(card.dataset.rot || 0);

        card.dataset.w = defaultW;
        card.dataset.h = defaultH;
        delete card.dataset.customResized;
        card.style.width = `${defaultW}px`;
        card.style.height = `${defaultH}px`;
        card.style.transform = `translate3d(${x - defaultW/2}px, ${y - defaultH/2}px, 0) rotate(${rot}deg)`;
      });

      savePositions(true);
      recordBoardChange(before);
      showToast('Size reset');
    }

    function createCardElement(item, savedPosMap) {
      const card = document.createElement('div');
      card.className = `media-card ${item.type === 'video' ? 'video-card' : (item.type === 'link' ? 'link-card' : 'image-card')}`;
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', `Open ${item.title || 'media item'}`);
      card.dataset.id = item.id;
      card.dataset.type = item.type;
      card.dataset.title = item.title || 'Media';
      if (item.folderId) card.dataset.folderId = item.folderId;

      let posX = item.x !== undefined ? item.x : 0;
      let posY = item.y !== undefined ? item.y : 0;
      let rot = item.rotation !== undefined ? item.rotation : 0;
      let z = item.z || 10;
      let w = item.w || (item.type === 'video' ? 440 : (item.type === 'link' ? 360 : 320));
      let h = item.h || (item.type === 'video' ? 260 : (item.type === 'link' ? 240 : 380));

      if (savedPosMap && savedPosMap[item.id]) {
        posX = savedPosMap[item.id].x;
        posY = savedPosMap[item.id].y;
        rot = savedPosMap[item.id].rot;
        z = savedPosMap[item.id].z || 10;
        if (savedPosMap[item.id].w) { w = savedPosMap[item.id].w; card.dataset.customResized = 'true'; }
        if (savedPosMap[item.id].h) { h = savedPosMap[item.id].h; card.dataset.customResized = 'true'; }
        if (z > highestZ) highestZ = z;
        if (savedPosMap[item.id].folderId) card.dataset.folderId = savedPosMap[item.id].folderId;
        else delete card.dataset.folderId;
      }

      card.dataset.x = posX;
      card.dataset.y = posY;
      card.dataset.rot = rot;
      card.dataset.w = w;
      card.dataset.h = h;
      if (item.w && item.h) card.dataset.naturalAspect = (item.w / item.h).toFixed(4);

      card.style.width = `${w}px`;
      card.style.height = `${h}px`;
      card.style.zIndex = z;
      card.style.transform = `translate3d(${posX - w/2}px, ${posY - h/2}px, 0) rotate(${rot}deg)`;

      if (item.type === 'video') {
        const vid = document.createElement('video');
        vid.src = item.video_src || item.url || '';
        if (item.poster_src || item.poster) vid.poster = item.poster_src || item.poster;
        vid.loop = true;
        vid.muted = true;
        vid.playsInline = true;
        vid.preload = 'metadata';
        vid.onloadedmetadata = () => {
          if (vid.videoWidth && vid.videoHeight) {
            card.dataset.naturalAspect = (vid.videoWidth / vid.videoHeight).toFixed(4);
          }
        };
        card.appendChild(vid);
        card.addEventListener('mouseenter', () => {
          vid.play().catch(() => {});
        });
        card.addEventListener('mouseleave', () => {
          vid.pause();
          vid.currentTime = 0;
        });
      } else if (item.type === 'youtube' || item.embed_type === 'youtube' || (item.url && item.url.includes('youtube.com'))) {
        const ytId = item.videoId || item.embed_id || (item.url && (item.url.match(/(?:v=|\/embed\/|youtu\.be\/)([^"&?\/\s]{11})/) || [])[1]);
        const imgSrc = item.img_src || item.poster || (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : '');
        const img = document.createElement('img');
        img.src = imgSrc;
        img.alt = item.title || 'YouTube video';
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer';
        card.dataset.naturalAspect = (16 / 9).toFixed(4);
        card.appendChild(img);
      } else {
        // Pure Image (Zero UI / No badges, no labels, no title/URL text)
        const imgSrc = item.img_src || item.poster || item.url || '';
        const img = document.createElement('img');
        img.src = imgSrc;
        img.alt = item.title || 'Moodboard image';
        img.loading = 'lazy';
        img.referrerPolicy = 'no-referrer';
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          if (img.naturalWidth && img.naturalHeight) {
            card.dataset.naturalAspect = (img.naturalWidth / img.naturalHeight).toFixed(4);
            if (!card.dataset.customResized && (!item.h || item.h === 280 || item.h === 380)) {
              const currentW = Number(card.dataset.w) || 380;
              const computedH = Math.max(140, Math.min(640, Math.round(currentW * (img.naturalHeight / img.naturalWidth))));
              card.style.height = `${computedH}px`;
              card.dataset.h = computedH;
            }
          }
        };
        card.appendChild(img);
      }

      // Zero-UI Subtle Card Resize Handles
      const handleTypes = ['nw', 'ne', 'se', 'sw', 'n', 'e', 's', 'w'];
      handleTypes.forEach(type => {
        const handle = document.createElement('div');
        handle.className = `card-resize-handle handle-${type}`;
        handle.dataset.handle = type;
        handle.setAttribute('aria-hidden', 'true');
        handle.addEventListener('mousedown', (e) => onCardResizeMouseDown(e, card, type));
        card.appendChild(handle);
      });

      // Drag & Lightbox handlers
      card.addEventListener('mousedown', (e) => onCardMouseDown(e, card));
      card.addEventListener('focus', () => selectCard(card, 'replace'));
      card.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        clearTimeout(folderClickTimer);
        openLightbox(item);
      });
      card.addEventListener('click', () => {
        if (dragMoved) return;
        const rootId = folderRootId(card);
        const isFolder = folderCards(rootId).length > 1;
        if (isFolder) {
          clearTimeout(folderClickTimer);
          folderClickTimer = setTimeout(() => {
            closeAllFolders(rootId);
            toggleFolder(rootId);
          }, 260);
        } else {
          closeAllFolders();
        }
      });
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          openLightbox(item);
        }
      });

      return card;
    }

    function onCardMouseDown(e, card) {
      if (e.button !== 0 || isCommandBarOpen) return;
      e.stopPropagation();

      finishPendingFling();
      clearFolderHover();
      clearTimeout(folderClickTimer);

      const rootId = folderRootId(card);
      const isDeckOpen = rootId && expandedFolders.has(rootId);
      const fCards = rootId ? folderCards(rootId) : [card];
      const isClosedDeckMember = fCards.length > 1 && !isDeckOpen;

      const hasMod = Boolean(e.shiftKey || e.metaKey || e.ctrlKey);
      if (hasMod) {
        selectCard(card, 'toggle');
        if (!selectedCardIds.has(card.dataset.id)) {
          return; // Card unselected, don't drag
        }
        clickedInsideMultiSelection = false;
      } else {
        if (selectedCardIds.has(card.dataset.id) && selectedCardIds.size > 1) {
          clickedInsideMultiSelection = true;
        } else {
          selectCard(card, 'replace');
          clickedInsideMultiSelection = false;
        }
      }

      activeCard = card;
      dragMoved = false;
      dragStartClientX = e.clientX;
      dragStartClientY = e.clientY;
      dragStartSnapshot = captureBoardSnapshot();

      let moving = [];
      if (selectedCardIds.has(card.dataset.id) && selectedCardIds.size > 1) {
        const selected = getSelectedCards();
        const movingSet = new Set();
        selected.forEach(c => {
          const rId = folderRootId(c);
          if (rId && !expandedFolders.has(rId) && folderCards(rId).length > 1) {
            folderCards(rId).forEach(fc => movingSet.add(fc));
          } else {
            movingSet.add(c);
          }
        });
        moving = Array.from(movingSet);
      } else if (isClosedDeckMember) {
        // Closed deck: drag the entire group together
        moving = fCards;
      } else {
        // Open deck or standalone card: drag only this selected card
        moving = [card];
      }

      const mouseWorldX = (e.clientX - panX) / scale;
      const mouseWorldY = (e.clientY - panY) / scale;
      dragStartMouseWorldX = mouseWorldX;
      dragStartMouseWorldY = mouseWorldY;

      draggedGroupCards = moving.map(c => {
        highestZ += 2;
        c.style.zIndex = highestZ;
        c.classList.add('dragging');

        let startX = Number(c.dataset.x);
        let startY = Number(c.dataset.y);
        let rot = Number(c.dataset.rot || 0);

        if (isDeckOpen && c.dataset.folderId) {
          const rect = c.getBoundingClientRect();
          startX = (rect.left + rect.width / 2 - panX) / scale;
          startY = (rect.top + rect.height / 2 - panY) / scale;
        }

        return {
          card: c,
          startX,
          startY,
          rot,
          w: Number(c.dataset.w || 320),
          h: Number(c.dataset.h || 240)
        };
      });

      const rect = card.getBoundingClientRect();
      const currentCardX = (rect.left + rect.width / 2 - panX) / scale;
      const currentCardY = (rect.top + rect.height / 2 - panY) / scale;

      cardOffsetX = mouseWorldX - currentCardX;
      cardOffsetY = mouseWorldY - currentCardY;

      lastCardX = currentCardX;
      lastCardY = currentCardY;
      lastMoveTime = performance.now();
      cardVx = 0;
      cardVy = 0;

      window.addEventListener('mousemove', onCardMouseMove);
      window.addEventListener('mouseup', onCardMouseUp);
    }

    function onCardMouseMove(e) {
      if (!activeCard) return;
      if (!dragMoved && Math.hypot(e.clientX - dragStartClientX, e.clientY - dragStartClientY) < 7) return;
      if (!dragMoved) {
        dragMoved = true;
        draggedGroupCards.forEach(entry => {
          const c = entry.card;
          const rId = folderRootId(c);
          if (rId && expandedFolders.has(rId)) {
            // Dragging an individual card or subset from an OPEN deck
            if (c.dataset.folderId) {
              const oldRootId = c.dataset.folderId;
              delete c.dataset.folderId;
              c.classList.remove('folder-member');
              c.dataset.x = entry.startX;
              c.dataset.y = entry.startY;
              layoutFolder(oldRootId);
            } else if (c.dataset.id === rId) {
              const remaining = folderCards(rId).filter(child => child !== c);
              if (remaining.length > 0) {
                const newRoot = remaining[0];
                delete newRoot.dataset.folderId;
                newRoot.classList.remove('folder-member');
                remaining.slice(1).forEach(child => { child.dataset.folderId = newRoot.dataset.id; });
                expandedFolders.delete(rId);
                if (remaining.length > 1) {
                  expandedFolders.add(newRoot.dataset.id);
                }
                layoutFolder(newRoot.dataset.id);
              }
              delete c.dataset.folderId;
              c.classList.remove('folder-member');
              c.dataset.x = entry.startX;
              c.dataset.y = entry.startY;
            }
          }
          // If closed deck, retain folder membership and move together
        });
      }

      const mouseWorldX = (e.clientX - panX) / scale;
      const mouseWorldY = (e.clientY - panY) / scale;
      const deltaWorldX = mouseWorldX - dragStartMouseWorldX;
      const deltaWorldY = mouseWorldY - dragStartMouseWorldY;

      draggedGroupCards.forEach(entry => {
        const newX = entry.startX + deltaWorldX;
        const newY = entry.startY + deltaWorldY;
        entry.card.dataset.x = newX;
        entry.card.dataset.y = newY;
        entry.card.style.transform = `translate3d(${newX - entry.w/2}px, ${newY - entry.h/2}px, 0) rotate(${entry.rot}deg) scale(1.02)`;
      });

      const primaryNewX = Number(activeCard.dataset.x);
      const primaryNewY = Number(activeCard.dataset.y);
      const now = performance.now();
      const dt = Math.max(1, now - lastMoveTime);
      cardVx = (primaryNewX - lastCardX) / dt;
      cardVy = (primaryNewY - lastCardY) / dt;

      lastCardX = primaryNewX;
      lastCardY = primaryNewY;
      lastMoveTime = now;

      updateFolderHover(e.clientX, e.clientY);
    }

    function onCardMouseUp() {
      if (!activeCard) return;
      const card = activeCard;
      const movingEntries = draggedGroupCards.slice();
      clearFolderHover();
      movingEntries.forEach(entry => entry.card.classList.remove('dragging'));
      window.removeEventListener('mousemove', onCardMouseMove);
      window.removeEventListener('mouseup', onCardMouseUp);
      activeCard = null;

      if (!dragMoved) {
        if (clickedInsideMultiSelection) {
          selectCard(card, 'replace');
        }
        movingEntries.forEach(entry => {
          const c = entry.card;
          if (c.dataset.folderId || folderCards(c.dataset.id).length > 1) layoutFolder(folderRootId(c));
          else setCardPose(c, Number(c.dataset.x), Number(c.dataset.y), Number(c.dataset.rot || 0));
        });
        dragStartSnapshot = null;
        draggedGroupCards = [];
        return;
      }

      const speed = Math.hypot(cardVx, cardVy);
      if (speed > 0.15) {
        let vx = cardVx * 16;
        let vy = cardVy * 16;
        let rotSpeed = (vx / 40);

        function stepFling() {
          vx *= 0.90;
          vy *= 0.90;
          rotSpeed *= 0.90;

          movingEntries.forEach(entry => {
            let curX = parseFloat(entry.card.dataset.x) + vx;
            let curY = parseFloat(entry.card.dataset.y) + vy;
            let curRot = (parseFloat(entry.card.dataset.rot || 0) + rotSpeed).toFixed(1);
            entry.card.dataset.x = curX;
            entry.card.dataset.y = curY;
            entry.card.dataset.rot = curRot;
            entry.card.style.transform = `translate3d(${curX - entry.w/2}px, ${curY - entry.h/2}px, 0) rotate(${curRot}deg)`;
          });

          if (Math.hypot(vx, vy) > 0.3) {
            activeFlingAnim = requestAnimationFrame(stepFling);
          } else {
            activeFlingAnim = null;
            const updatedFolders = new Set();
            movingEntries.forEach(entry => {
              const rId = folderRootId(entry.card);
              if (rId && folderCards(rId).length > 1) updatedFolders.add(rId);
            });
            updatedFolders.forEach(layoutFolder);
            savePositions();
            recordBoardChange(dragStartSnapshot);
            dragStartSnapshot = null;
            draggedGroupCards = [];
          }
        }
        activeFlingAnim = requestAnimationFrame(stepFling);
      } else {
        const updatedFolders = new Set();
        movingEntries.forEach(entry => {
          const rId = folderRootId(entry.card);
          if (rId && folderCards(rId).length > 1) {
            updatedFolders.add(rId);
          } else {
            const rot = parseFloat(entry.card.dataset.rot || 0);
            const x = parseFloat(entry.card.dataset.x);
            const y = parseFloat(entry.card.dataset.y);
            entry.card.style.transform = `translate3d(${x - entry.w/2}px, ${y - entry.h/2}px, 0) rotate(${rot}deg)`;
          }
        });
        updatedFolders.forEach(layoutFolder);
        savePositions();
        recordBoardChange(dragStartSnapshot);
        dragStartSnapshot = null;
        draggedGroupCards = [];
      }
    }

    function finishPendingFling() {
      if (!activeFlingAnim) return;
      cancelAnimationFrame(activeFlingAnim);
      activeFlingAnim = null;
      layoutAllFolders();
      savePositions();
      recordBoardChange(dragStartSnapshot);
      dragStartSnapshot = null;
      draggedGroupCards = [];
    }

    // ============================================================
    // PERSISTENT POSITIONS & AUTO-ARRANGE
    // ============================================================

    function savePositions(immediate = false) {
      const pos = {};
      world.querySelectorAll('.media-card').forEach(el => {
        if (!el.dataset.id) return;
        pos[el.dataset.id] = {
          x: parseFloat(el.dataset.x),
          y: parseFloat(el.dataset.y),
          rot: parseFloat(el.dataset.rot || 0),
          z: parseInt(el.style.zIndex || 10),
          w: parseFloat(el.dataset.w),
          h: parseFloat(el.dataset.h),
          ...(el.dataset.folderId ? { folderId: el.dataset.folderId } : {})
        };
      });

      try {
        localStorage.setItem(`${STORAGE_PREFIX_POS}${activeBoardId}`, JSON.stringify(pos));
      } catch(e) {}

      if (savePositionsTimer) clearTimeout(savePositionsTimer);
      const boardId = activeBoardId;
      const send = () => {
        savePositionsTimer = null;
        fetch(`${API_ENDPOINT}?action=save_positions&board=${encodeURIComponent(boardId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ positions: pos })
        }).catch(() => {});
      };
      if (immediate) send();
      else savePositionsTimer = setTimeout(send, 1200);
    }

    function loadSavedPositions() {
      try {
        const raw = localStorage.getItem(`${STORAGE_PREFIX_POS}${activeBoardId}`);
        return raw ? JSON.parse(raw) : null;
      } catch(e) {
        return null;
      }
    }

    async function resetDefaultPositions() {
      finishPendingFling();
      const before = captureBoardSnapshot();
      try {
        if (savePositionsTimer) clearTimeout(savePositionsTimer);
        savePositionsTimer = null;
        const response = await fetch(`${API_ENDPOINT}?action=reset_positions&board=${encodeURIComponent(activeBoardId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ board: activeBoardId })
        });
        const data = await response.json();
        if (!response.ok || data.status !== 'ok') throw new Error(data.message || 'Reset failed');
        localStorage.removeItem(`${STORAGE_PREFIX_POS}${activeBoardId}`);
        await loadActiveBoard();
        recordBoardChange(before);
        showToast('Layout Reset');
      } catch (e) {
        showToast('Could not reset layout', true);
      }
    }

    function autoArrangeGrid() {
      finishPendingFling();
      const cards = Array.from(document.querySelectorAll('.media-card'));
      if (cards.length === 0) return;
      const before = captureBoardSnapshot();
      expandedFolders.clear();

      const cols = Math.ceil(Math.sqrt(cards.length * 1.3));
      const colWidth = 380;
      const rowHeight = 320;
      const startX = -((cols - 1) * colWidth) / 2;
      const startY = -((Math.ceil(cards.length / cols) - 1) * rowHeight) / 2;

      cards.forEach((card, idx) => {
        delete card.dataset.folderId;
        card.classList.remove('folder-member');
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        const targetX = startX + c * colWidth;
        const targetY = startY + r * rowHeight;
        const rot = (idx % 2 === 0 ? 0.5 : -0.5);

        card.dataset.x = targetX;
        card.dataset.y = targetY;
        card.dataset.rot = rot;
        card.style.transform = `translate3d(${targetX - card.dataset.w/2}px, ${targetY - card.dataset.h/2}px, 0) rotate(${rot}deg)`;
      });

      savePositions();
      recordBoardChange(before);
      zoomToFitAll();
      showToast('Grid Arranged');
    }

    // ============================================================
    // MULTI-BOARD MANAGEMENT
    // ============================================================

    async function loadBoardsList() {
      try {
        const res = await fetch(`${API_ENDPOINT}?action=list_boards`);
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.boards)) {
            availableBoards = data.boards;
            return;
          }
        }
      } catch (err) {}

      // Local fallback
      let custom = [];
      try {
        const raw = localStorage.getItem(STORAGE_KEY_CUSTOM_BOARDS);
        if (raw) custom = JSON.parse(raw);
      } catch(e) {}

      availableBoards = [
        { id: 'vudrag', title: 'Nikola Vudrag Master Film', description: 'Master spatial board' },
        { id: 'trakoscan', title: 'Trakošćan Heritage & Pejzaž', description: 'Castle & lake photography' },
        { id: 'garda', title: 'Varaždinska Građanska Garda', description: 'Historical guard & badges' },
        { id: 'streetwear', title: 'Studio Varaždin Streetwear', description: 'Apparel graphic prototypes' },
        ...custom
      ];
    }

    async function switchBoard(boardId) {
      finishPendingFling();
      if (savePositionsTimer) clearTimeout(savePositionsTimer);
      savePositionsTimer = null;
      selectCard(null);
      undoStack.length = 0;
      redoStack.length = 0;
      activeBoardId = boardId;
      try {
        localStorage.setItem(STORAGE_KEY_ACTIVE_BOARD, activeBoardId);
      } catch(e) {}
      window.location.hash = `board=${encodeURIComponent(boardId)}`;

      const hasCamera = loadCamera();
      updateCamera();
      await loadActiveBoard();
      if (!hasCamera) focusOpeningFrame();
      showToast(`Switched to: ${boardId}`);
    }

    async function createNewBoard(title) {
      try {
        const response = await fetch(`${API_ENDPOINT}?action=create_board`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        const data = await response.json();
        if (!response.ok || data.status !== 'ok' || !data.board?.id) throw new Error(data.message || 'Board creation failed');
        await loadBoardsList();
        await switchBoard(data.board.id);
        showToast(`Created board: ${title}`);
      } catch (e) {
        showToast('Could not create board', true);
      }
    }

    async function deleteCurrentCustomBoard() {
      if (['vudrag', 'trakoscan', 'garda', 'streetwear'].includes(activeBoardId)) {
        showToast('Cannot delete system board', true);
        return;
      }

      if (!confirm(`Delete board "${activeBoardId}"?`)) return;

      try {
        const response = await fetch(`${API_ENDPOINT}?action=delete_board&board=${encodeURIComponent(activeBoardId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ board: activeBoardId })
        });
        const data = await response.json();
        if (!response.ok || data.status !== 'ok') throw new Error(data.message || 'Delete failed');
        localStorage.removeItem(`${STORAGE_PREFIX_CAMERA}${activeBoardId}`);
        localStorage.removeItem(`${STORAGE_PREFIX_POS}${activeBoardId}`);
        await loadBoardsList();
        await switchBoard('vudrag');
        showToast('Board Deleted');
      } catch (e) {
        showToast('Could not delete board', true);
      }
    }

    async function loadActiveBoard() {
      world.querySelectorAll('.media-card').forEach(c => c.remove());
      currentItems = [];

      try {
        const res = await fetch(`${API_ENDPOINT}?action=get&board=${encodeURIComponent(activeBoardId)}`);
        if (res.ok) {
          const data = await res.json();
          const board = data.board || data;
          if (data && data.status === 'ok' && Array.isArray(board.items)) {
            renderBoard(board.items, board.positions);
            return;
          }
        }
      } catch(err) {}

      // Fallback for default vudrag board
      if (activeBoardId === 'vudrag') {
        try {
          const res = await fetch('data/default_board.json');
          const defaultItems = await res.json();
          renderBoard(defaultItems);
          return;
        } catch(e) {}
      }

      renderBoard([]);
    }

    function renderBoard(items, serverPositions = null) {
      currentItems = items;
      selectCard(null);
      clearFolderHover();
      clearTimeout(folderClickTimer);
      expandedFolders.clear();
      world.querySelectorAll('.media-card').forEach(c => c.remove());
      const localPos = loadSavedPositions();
      const savedPos = Object.assign({}, serverPositions || {}, localPos || {});

      items.forEach(item => {
        const card = createCardElement(item, savedPos);
        world.appendChild(card);
      });
      world.querySelectorAll('.media-card[data-folder-id]').forEach(card => {
        const root = getCard(card.dataset.folderId);
        if (!root || root === card || root.dataset.folderId) delete card.dataset.folderId;
      });
      layoutAllFolders();
    }

    function getSelectedCards() {
      return Array.from(world.querySelectorAll('.media-card[data-id]'))
        .filter(card => selectedCardIds.has(card.dataset.id));
    }

    function selectCard(card, mode = 'replace') {
      if (!card) {
        selectedCardIds.clear();
        selectedCardId = null;
      } else {
        const id = card.dataset.id;
        if (mode === 'replace') {
          selectedCardIds.clear();
          if (id) selectedCardIds.add(id);
          selectedCardId = id || null;
        } else if (mode === 'toggle') {
          if (id) {
            if (selectedCardIds.has(id)) {
              selectedCardIds.delete(id);
            } else {
              selectedCardIds.add(id);
            }
          }
          selectedCardId = selectedCardIds.size > 0 ? selectedCardIds.values().next().value : null;
        } else if (mode === 'add') {
          if (id) selectedCardIds.add(id);
          selectedCardId = id || null;
        }
      }
      world.querySelectorAll('.media-card[data-id]').forEach(el => {
        el.classList.toggle('is-selected', selectedCardIds.has(el.dataset.id));
      });
    }

    function selectAllCards() {
      selectedCardIds.clear();
      world.querySelectorAll('.media-card[data-id]').forEach(el => {
        if (el.dataset.id) selectedCardIds.add(el.dataset.id);
        el.classList.add('is-selected');
      });
      selectedCardId = selectedCardIds.values().next().value || null;
      showToast(`Selected all (${selectedCardIds.size})`);
    }

    function captureBoardSnapshot() {
      const positions = {};
      world.querySelectorAll('.media-card[data-id]').forEach(card => {
        positions[card.dataset.id] = {
          x: Number(card.dataset.x), y: Number(card.dataset.y),
          rot: Number(card.dataset.rot || 0), z: Number(card.style.zIndex || 10),
          w: Number(card.dataset.w), h: Number(card.dataset.h),
          ...(card.dataset.folderId ? { folderId: card.dataset.folderId } : {})
        };
      });
      return { items: structuredClone(currentItems), positions };
    }

    function recordBoardChange(before) {
      if (!before) return;
      const after = captureBoardSnapshot();
      if (JSON.stringify(before) === JSON.stringify(after)) return;
      undoStack.push({ before, after });
      if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
      redoStack.length = 0;
    }

    async function restoreBoardSnapshot(snapshot) {
      if (savePositionsTimer) clearTimeout(savePositionsTimer);
      savePositionsTimer = null;
      const response = await fetch(`${API_ENDPOINT}?action=import_board&board=${encodeURIComponent(activeBoardId)}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(snapshot)
      });
      const data = await response.json();
      if (!response.ok || data.status !== 'ok') throw new Error(data.message || 'Could not restore board');
      try { localStorage.setItem(`${STORAGE_PREFIX_POS}${activeBoardId}`, JSON.stringify(snapshot.positions)); } catch (error) {}
      renderBoard(structuredClone(snapshot.items), snapshot.positions);
    }

    async function travelBoardHistory(from, to, key, label) {
      finishPendingFling();
      if (historyBusy || !from.length) return;
      historyBusy = true;
      const entry = from[from.length - 1];
      try {
        await restoreBoardSnapshot(entry[key]);
        from.pop();
        to.push(entry);
        showToast(label);
      } catch (error) {
        showToast('Could not restore board', true);
      } finally {
        historyBusy = false;
      }
    }

    function undoBoardChange() { return travelBoardHistory(undoStack, redoStack, 'before', 'Undo'); }
    function redoBoardChange() { return travelBoardHistory(redoStack, undoStack, 'after', 'Redo'); }

    async function deleteSelectedCard() {
      if (historyBusy) return;
      if (selectedCardIds.size === 0 && !selectedCardId) { showToast('Select media first'); return; }
      finishPendingFling();
      const idsToDelete = selectedCardIds.size > 0 ? Array.from(selectedCardIds) : (selectedCardId ? [selectedCardId] : []);
      if (!idsToDelete.length) return;

      const before = captureBoardSnapshot();
      historyBusy = true;
      try {
        if (savePositionsTimer) clearTimeout(savePositionsTimer);
        savePositionsTimer = null;
        for (const id of idsToDelete) {
          try {
            await fetch(`${API_ENDPOINT}?action=delete_item&board=${encodeURIComponent(activeBoardId)}`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id })
            });
          } catch(e) {}
        }
        currentItems = currentItems.filter(item => !idsToDelete.includes(item.id));
        idsToDelete.forEach(id => {
          world.querySelectorAll('.media-card[data-id]').forEach(card => { if (card.dataset.id === id) card.remove(); });
          expandedFolders.delete(id);
        });

        // Re-home children whose parent folder was deleted
        const remaining = Array.from(world.querySelectorAll('.media-card[data-id]'));
        idsToDelete.forEach(id => {
          remaining.filter(card => card.dataset.folderId === id).forEach((card, index) => {
            delete card.dataset.folderId;
            card.classList.remove('folder-member');
            card.dataset.x = Number(card.dataset.x) + (index - 1) * 70;
            card.dataset.y = Number(card.dataset.y) + index * 45;
            setCardPose(card, Number(card.dataset.x), Number(card.dataset.y), Number(card.dataset.rot || 0));
          });
        });
        layoutAllFolders();

        const positions = loadSavedPositions() || {};
        idsToDelete.forEach(id => delete positions[id]);
        try { localStorage.setItem(`${STORAGE_PREFIX_POS}${activeBoardId}`, JSON.stringify(positions)); } catch (error) {}
        savePositions();
        selectCard(null);
        recordBoardChange(before);
        showToast(idsToDelete.length > 1 ? `Deleted ${idsToDelete.length} media items` : 'Media deleted');
      } catch (error) {
        showToast('Could not delete media', true);
      } finally {
        historyBusy = false;
      }
    }

    // ============================================================
    // ADD LINK / URL
    // ============================================================

    function urlsFromText(text) {
      const matches = String(text || '').match(/(?:https?:\/\/|www\.)[^\s<>"'`]+/gi) || [];
      return matches.map(raw => {
        let candidate = raw.replace(/[.,;!?]+$/, '');
        for (const [closing, opening] of [[')', '('], [']', '['], ['}', '{']]) {
          while (candidate.endsWith(closing) && candidate.split(closing).length > candidate.split(opening).length) {
            candidate = candidate.slice(0, -1);
          }
        }
        try {
          const url = new URL(/^www\./i.test(candidate) ? `https://${candidate}` : candidate);
          return ['http:', 'https:'].includes(url.protocol) ? url.href : null;
        } catch (error) {
          return null;
        }
      }).filter(Boolean);
    }

    function urlsFromTransfer(transfer) {
      if (!transfer) return [];
      const read = type => { try { return transfer.getData(type) || ''; } catch (error) { return ''; } };
      const uriList = read('text/uri-list').split(/\r?\n/).filter(line => !line.startsWith('#')).join('\n');
      const sources = [uriList, read('public.url'), read('text/x-moz-url-data'), read('text/x-moz-url'), read('text/plain'), read('public.utf8-plain-text')];
      let urls = sources.flatMap(urlsFromText);
      if (!urls.length) {
        const html = read('text/html');
        if (html) {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const element = doc.querySelector('img[src], video[src], source[src], a[href]');
          if (element) urls = urlsFromText(element.getAttribute('src') || element.getAttribute('href'));
        }
      }
      return [...new Set(urls)].slice(0, 12);
    }

    function uploadableFiles(transfer) {
      return Array.from(transfer?.files || []).filter(file =>
        /^(image|video)\//.test(file.type) || /\.(jpe?g|png|gif|webp|mp4|mov|webm|mkv|avi|m4v)$/i.test(file.name)
      );
    }

    function viewCenterWorld() {
      return { x: (window.innerWidth / 2 - panX) / scale, y: (window.innerHeight / 2 - panY) / scale };
    }

    async function addMediaLinks(urls, x, y) {
      const boardId = activeBoardId;
      for (let i = 0; i < urls.length; i++) {
        await addMediaLink(urls[i], x + (i % 4) * 72, y + Math.floor(i / 4) * 72, boardId);
      }
    }

    async function addMediaLink(url, targetX, targetY, boardId = activeBoardId) {
      if (!url) return;
      finishPendingFling();
      const before = activeBoardId === boardId ? captureBoardSnapshot() : null;
      showToast('Adding link...');
      const center = viewCenterWorld();

      try {
        const res = await fetch(`${API_ENDPOINT}?action=add_link&board=${encodeURIComponent(boardId)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, x: targetX ?? center.x, y: targetY ?? center.y })
        });
        const data = await res.json();

        if (res.ok && data && data.status === 'ok' && data.item) {
          if (activeBoardId === boardId) {
            currentItems.push(data.item);
            const card = createCardElement(data.item, null);
            world.appendChild(card);
            recordBoardChange(before);
          }
          showToast('✓ Link added to board');
        } else {
          throw new Error(data.message || 'Error adding link');
        }
      } catch (err) {
        showToast(err.message || 'Could not add link', true);
      }
    }

    // ============================================================
    // FILE UPLOAD ENGINE (WebP & MP4 Auto-Compression)
    // ============================================================

    function handleFileInputChange(e, type) {
      if (e.target.files && e.target.files.length > 0) {
        const centerX = (window.innerWidth / 2 - panX) / scale;
        const centerY = (window.innerHeight / 2 - panY) / scale;
        processAndUploadFiles(e.target.files, centerX, centerY);
        e.target.value = '';
      }
    }

    window.addEventListener('paste', (e) => {
      if (activeLightboxItem) return;
      const editable = e.target.closest?.('input, textarea, select, [contenteditable="true"]');
      if (editable && e.target !== commandInput) return;
      if (activeSubmode === 'create_board') return;

      const files = uploadableFiles(e.clipboardData);
      const urls = urlsFromTransfer(e.clipboardData);
      if (!files.length && !urls.length) return;
      e.preventDefault();
      if (isCommandBarOpen) closeCommandBar();
      const center = viewCenterWorld();
      if (files.length) processAndUploadFiles(files, center.x, center.y);
      else addMediaLinks(urls, center.x, center.y);
    });

    let dragCounter = 0;
    function hasBoardDropData(transfer) {
      return Array.from(transfer?.types || []).some(type =>
        ['Files', 'text/uri-list', 'text/plain', 'text/html', 'text/x-moz-url', 'text/x-moz-url-data', 'public.url', 'public.utf8-plain-text'].includes(type)
      );
    }

    window.addEventListener('dragenter', (e) => {
      if (!hasBoardDropData(e.dataTransfer) || activeLightboxItem || e.target.closest?.('#command-backdrop')) return;
      e.preventDefault();
      dragCounter++;
      dropOverlay.classList.add('active');
    });

    window.addEventListener('dragover', (e) => {
      if (!hasBoardDropData(e.dataTransfer) || activeLightboxItem || e.target.closest?.('#command-backdrop')) return;
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    });

    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dropOverlay.classList.remove('active');
      }
    });

    window.addEventListener('drop', (e) => {
      if (!hasBoardDropData(e.dataTransfer) || activeLightboxItem || e.target.closest?.('#command-backdrop')) return;
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.remove('active');

      const dropWorldX = (e.clientX - panX) / scale;
      const dropWorldY = (e.clientY - panY) / scale;
      const urls = urlsFromTransfer(e.dataTransfer);
      const files = uploadableFiles(e.dataTransfer);
      if (urls.length) addMediaLinks(urls, dropWorldX, dropWorldY);
      else if (files.length) processAndUploadFiles(files, dropWorldX, dropWorldY);
    });

    async function processAndUploadFiles(fileList, targetX, targetY) {
      const files = Array.from(fileList);
      if (files.length === 0) return;
      const boardId = activeBoardId;

      showToast(`Uploading ${files.length} media item(s)...`);

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const isVideo = file.type.startsWith('video/') || /\.(mp4|mov|webm|mkv|avi|m4v)$/i.test(file.name);
        const offsetX = targetX + (i % 4) * 60;
        const offsetY = targetY + Math.floor(i / 4) * 60;

        const placeholderCard = document.createElement('div');
        placeholderCard.className = 'media-card placeholder-card';
        const pW = isVideo ? 440 : 320;
        const pH = isVideo ? 260 : 380;
        placeholderCard.style.width = `${pW}px`;
        placeholderCard.style.height = `${pH}px`;
        placeholderCard.style.transform = `translate3d(${offsetX - pW/2}px, ${offsetY - pH/2}px, 0)`;
        placeholderCard.innerHTML = `<div class="placeholder-spinner"></div>`;
        world.appendChild(placeholderCard);

        try {
          const before = captureBoardSnapshot();
          const formData = new FormData();
          formData.append('file', file);
          formData.append('x', offsetX);
          formData.append('y', offsetY);
          formData.append('board', boardId);

          const res = await fetch(`${API_ENDPOINT}?action=upload&board=${encodeURIComponent(boardId)}`, {
            method: 'POST',
            body: formData
          });

          const data = await res.json();
          placeholderCard.remove();

          const uploadedItems = data.item ? [data.item] : data.items;
          if (res.ok && data && data.status === 'ok' && Array.isArray(uploadedItems)) {
            if (activeBoardId === boardId) {
              uploadedItems.forEach(newItem => {
                if (newItem.type === 'video' && !newItem.video_src) newItem.video_src = newItem.url;
                if (newItem.type === 'image' && !newItem.img_src) newItem.img_src = newItem.url;
                currentItems.push(newItem);
                const card = createCardElement(newItem, null);
                world.appendChild(card);
              });
            }
            recordBoardChange(before);
            showToast(`✓ Saved: ${file.name}`);
          } else {
            throw new Error(data.message || 'Upload error');
          }
        } catch (err) {
          placeholderCard.remove();
          showToast(`Upload failed: ${err.message || file.name}`, true);
        }
      }
    }

    // ============================================================
    // JSON EXPORT & IMPORT
    // ============================================================

    function exportBoardJson() {
      const posMap = captureBoardSnapshot().positions;
      const exportItems = currentItems.map(item => {
        const pos = posMap[item.id] || {};
        const exported = Object.assign({}, item, {
          x: pos.x !== undefined ? pos.x : item.x,
          y: pos.y !== undefined ? pos.y : item.y,
          rotation: pos.rot !== undefined ? pos.rot : item.rotation,
          z: pos.z !== undefined ? pos.z : item.z,
          w: pos.w !== undefined ? pos.w : item.w,
          h: pos.h !== undefined ? pos.h : item.h
        });
        if (pos.folderId) exported.folderId = pos.folderId;
        else delete exported.folderId;
        return exported;
      });

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportItems, null, 2));
      const dlAnchor = document.createElement('a');
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `moodboard_${activeBoardId}_export.json`);
      document.body.appendChild(dlAnchor);
      dlAnchor.click();
      dlAnchor.remove();
      showToast('Board JSON Exported');
    }

    function handleImportJsonFile(e) {
      if (e.target.files && e.target.files[0]) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const importedItems = JSON.parse(event.target.result);
            if (Array.isArray(importedItems)) {
              finishPendingFling();
              const before = captureBoardSnapshot();
              if (savePositionsTimer) clearTimeout(savePositionsTimer);
              savePositionsTimer = null;
              const response = await fetch(`${API_ENDPOINT}?action=import_board&board=${encodeURIComponent(activeBoardId)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ board: activeBoardId, items: importedItems })
              });
              const data = await response.json();
              if (!response.ok || data.status !== 'ok') throw new Error(data.message || 'Import failed');
              localStorage.removeItem(`${STORAGE_PREFIX_POS}${activeBoardId}`);
              renderBoard(importedItems);
              recordBoardChange(before);
              zoomToFitAll();
              showToast(`Imported ${importedItems.length} items`);
            } else {
              throw new Error('Expected an item list');
            }
          } catch(err) {
            showToast('Could not import board JSON', true);
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      }
    }

    // ============================================================
    // ZERO-UI CUSTOM VIDEO PLAYER & LIGHTBOX ENGINE
    // ============================================================

    let activePlayerVideo = null;
    let activePlayerIdleTimer = null;
    let activePlayerScrubbing = false;
    let activePlayerClickTimer = null;
    const PLAYER_RATES = [1.0, 1.25, 1.5, 2.0, 0.5];
    let currentRateIndex = 0;

    function formatPlayerTime(seconds) {
      if (isNaN(seconds) || seconds < 0) seconds = 0;
      const totalSec = Math.floor(seconds);
      const hrs = Math.floor(totalSec / 3600);
      const mins = Math.floor((totalSec % 3600) / 60);
      const secs = totalSec % 60;
      if (hrs > 0) {
        return `${hrs}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function triggerPlayerPulse(type, label = '') {
      const pulse = document.getElementById('player-pulse');
      const iconBox = document.getElementById('pulse-icon-box');
      if (!pulse || !iconBox) return;

      let iconSvg = '';
      if (type === 'play') {
        iconSvg = `<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
      } else if (type === 'pause') {
        iconSvg = `<svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
      } else if (type === 'step-back') {
        iconSvg = `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.2 3.16-1.98 5.12-1.98 3.52 0 6.44 2.38 7.31 5.6l2.42-.8C21.05 10.74 17.17 8 12.5 8z"/><text x="12.5" y="15.8" font-size="6.5" font-weight="700" font-family="-apple-system, sans-serif" fill="currentColor" text-anchor="middle">5</text></svg>`;
      } else if (type === 'step-fwd') {
        iconSvg = `<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.2-3.16-1.98-5.12-1.98-3.52 0-6.44 2.38-7.31 5.6l-2.42-.8C2.95 10.74 6.83 8 11.5 8z"/><text x="11.5" y="15.8" font-size="6.5" font-weight="700" font-family="-apple-system, sans-serif" fill="currentColor" text-anchor="middle">5</text></svg>`;
      } else if (type === 'volume-mute') {
        iconSvg = `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`;
      } else if (type === 'volume-up') {
        iconSvg = `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
      } else if (type === 'text') {
        iconSvg = `<span style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;letter-spacing:0.03em;">${label}</span>`;
      }

      iconBox.innerHTML = iconSvg;
      pulse.classList.remove('animate');
      void pulse.offsetWidth;
      pulse.classList.add('animate');
    }

    function updateVolumeIcon(video, volumeBtn) {
      if (!video || !volumeBtn) return;
      if (video.muted || video.volume === 0) {
        volumeBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`;
      } else if (video.volume < 0.5) {
        volumeBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
      } else {
        volumeBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
      }
    }

    function updatePlayIcon(isPlaying) {
      const playBtn = document.getElementById('player-play-btn');
      if (!playBtn) return;
      if (isPlaying) {
        playBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
      } else {
        playBtn.innerHTML = `<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
      }
    }

    function toggleCustomPlayerPlay() {
      if (!activePlayerVideo) return;
      if (activePlayerVideo.paused || activePlayerVideo.ended) {
        activePlayerVideo.play().then(() => {
          triggerPlayerPulse('play');
        }).catch(() => {});
      } else {
        activePlayerVideo.pause();
        triggerPlayerPulse('pause');
      }
    }

    function customPlayerSeek(deltaSec) {
      if (!activePlayerVideo || !activePlayerVideo.duration) return;
      const targetTime = Math.max(0, Math.min(activePlayerVideo.duration, activePlayerVideo.currentTime + deltaSec));
      activePlayerVideo.currentTime = targetTime;
      triggerPlayerPulse(deltaSec < 0 ? 'step-back' : 'step-fwd');
    }

    function customPlayerSeekToPercent(pct) {
      if (!activePlayerVideo || !activePlayerVideo.duration) return;
      const clamped = Math.max(0, Math.min(1, pct));
      activePlayerVideo.currentTime = clamped * activePlayerVideo.duration;
      triggerPlayerPulse('text', `${Math.round(clamped * 100)}%`);
    }

    function toggleCustomPlayerMute() {
      if (!activePlayerVideo) return;
      activePlayerVideo.muted = !activePlayerVideo.muted;
      const volSlider = document.getElementById('player-volume-slider');
      const volBtn = document.getElementById('player-volume-toggle-btn');
      if (volSlider) {
        volSlider.value = activePlayerVideo.muted ? 0 : (activePlayerVideo.volume || 1);
      }
      updateVolumeIcon(activePlayerVideo, volBtn);
      triggerPlayerPulse(activePlayerVideo.muted ? 'volume-mute' : 'volume-up');
    }

    function customPlayerVolumeChange(delta) {
      if (!activePlayerVideo) return;
      let newVol = Math.max(0, Math.min(1, activePlayerVideo.volume + delta));
      activePlayerVideo.volume = newVol;
      activePlayerVideo.muted = (newVol === 0);
      const volSlider = document.getElementById('player-volume-slider');
      const volBtn = document.getElementById('player-volume-toggle-btn');
      if (volSlider) volSlider.value = newVol;
      updateVolumeIcon(activePlayerVideo, volBtn);
      triggerPlayerPulse('text', `VOL ${Math.round(newVol * 100)}%`);
    }

    function toggleCustomPlayerFullscreen() {
      const player = document.getElementById('custom-video-player');
      if (!player) return;

      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (player.requestFullscreen) {
          player.requestFullscreen();
        } else if (player.webkitRequestFullscreen) {
          player.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function resetPlayerIdleTimer(player, video) {
      player.classList.remove('is-idle');
      if (activePlayerIdleTimer) clearTimeout(activePlayerIdleTimer);
      if (!video.paused && !activePlayerScrubbing) {
        activePlayerIdleTimer = setTimeout(() => {
          if (!video.paused && !activePlayerScrubbing) {
            player.classList.add('is-idle');
          }
        }, 2200);
      }
    }

    function handlePlayerKeydown(e) {
      if (!activeLightboxItem || activeLightboxItem.type !== 'video' || !activePlayerVideo) return false;

      if (e.code === 'Space' || e.key === 'k' || e.key === 'K') {
        e.preventDefault();
        toggleCustomPlayerPlay();
        return true;
      }
      if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleCustomPlayerFullscreen();
        return true;
      }
      if (e.key === 'm' || e.key === 'M') {
        e.preventDefault();
        toggleCustomPlayerMute();
        return true;
      }
      if (e.key === 'ArrowLeft' || e.key === 'j' || e.key === 'J') {
        e.preventDefault();
        customPlayerSeek(-5);
        return true;
      }
      if (e.key === 'ArrowRight' || e.key === 'l' || e.key === 'L') {
        e.preventDefault();
        customPlayerSeek(5);
        return true;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        customPlayerVolumeChange(0.1);
        return true;
      }
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        customPlayerVolumeChange(-0.1);
        return true;
      }
      if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        const pct = parseInt(e.key, 10) / 10;
        customPlayerSeekToPercent(pct);
        return true;
      }
      return false;
    }

    function cleanupCustomVideoPlayer() {
      if (activePlayerIdleTimer) {
        clearTimeout(activePlayerIdleTimer);
        activePlayerIdleTimer = null;
      }
      if (activePlayerClickTimer) {
        clearTimeout(activePlayerClickTimer);
        activePlayerClickTimer = null;
      }
      if (activePlayerVideo) {
        try {
          activePlayerVideo.pause();
          activePlayerVideo.removeAttribute('src');
          activePlayerVideo.load();
        } catch(e) {}
        activePlayerVideo = null;
      }
      activePlayerScrubbing = false;
    }

    function renderCustomVideoPlayer(container, item) {
      cleanupCustomVideoPlayer();
      currentRateIndex = 0;

      const title = escapeHtml(item.title || 'Studio Varaždin Video');
      const actionTag = escapeHtml(item.action || item.realm_title || (item.is_vertical ? '9:16 Vertical' : 'Film Media'));
      const poster = item.poster_src || item.poster || item.img_src;
      const posterAttr = poster ? `poster="${escapeHtml(poster)}"` : '';

      container.innerHTML = `
        <div class="custom-video-player" id="custom-video-player">
          <video id="player-video" src="${escapeHtml(item.video_src || item.url || '')}" ${posterAttr} playsinline preload="auto"></video>

          <div class="player-center-pulse" id="player-pulse">
            <div class="pulse-icon-box" id="pulse-icon-box"></div>
          </div>

          <div class="player-hud" id="player-hud">
            <div class="player-top-bar">
              <div class="player-title-box">
                <span class="player-film-title">${title}</span>
                ${actionTag ? `<span class="player-film-badge">${actionTag}</span>` : ''}
              </div>
              <button type="button" class="player-hud-btn player-close-btn" title="Close (Esc)" onclick="closeLightbox()">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>

            <div class="player-bottom-controls">
              <div class="player-timeline" id="player-timeline">
                <div class="timeline-hover-bubble" id="timeline-hover-bubble">00:00</div>
                <div class="timeline-track">
                  <div class="timeline-buffer-bar" id="timeline-buffer-bar"></div>
                  <div class="timeline-progress-bar" id="timeline-progress-bar">
                    <div class="timeline-handle"></div>
                  </div>
                </div>
              </div>

              <div class="player-controls-row">
                <div class="player-controls-group player-controls-left">
                  <button type="button" class="player-hud-btn player-play-btn" id="player-play-btn" title="Play/Pause (Space / K)">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                  </button>

                  <button type="button" class="player-hud-btn" id="player-step-back-btn" title="Back 5s (← / J)">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                      <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.2 3.16-1.98 5.12-1.98 3.52 0 6.44 2.38 7.31 5.6l2.42-.8C21.05 10.74 17.17 8 12.5 8z"/>
                      <text x="12.5" y="15.8" font-size="6.5" font-weight="700" font-family="-apple-system, sans-serif" fill="currentColor" text-anchor="middle">5</text>
                    </svg>
                  </button>

                  <button type="button" class="player-hud-btn" id="player-step-fwd-btn" title="Forward 5s (→ / L)">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                      <path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.2-3.16-1.98-5.12-1.98-3.52 0-6.44 2.38-7.31 5.6l-2.42-.8C2.95 10.74 6.83 8 11.5 8z"/>
                      <text x="11.5" y="15.8" font-size="6.5" font-weight="700" font-family="-apple-system, sans-serif" fill="currentColor" text-anchor="middle">5</text>
                    </svg>
                  </button>

                  <div class="player-timecode-box">
                    <span class="tc-current" id="tc-current">00:00</span>
                    <span class="tc-divider">/</span>
                    <span class="tc-duration" id="tc-duration">00:00</span>
                  </div>
                </div>

                <div class="player-controls-group player-controls-right">
                  <button type="button" class="player-hud-btn player-pill-btn" id="player-rate-btn" title="Playback Speed">
                    1.0×
                  </button>

                  <button type="button" class="player-hud-btn" id="player-loop-toggle-btn" title="Toggle Loop (L)">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="17 1 21 5 17 9"></polyline>
                      <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                      <polyline points="7 23 3 19 7 15"></polyline>
                      <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                  </button>

                  <div class="player-volume-container" id="player-volume-container">
                    <button type="button" class="player-hud-btn" id="player-volume-toggle-btn" title="Mute/Unmute (M)">
                      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"></polygon>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                      </svg>
                    </button>
                    <div class="player-volume-slider-track">
                      <input type="range" class="player-volume-slider" id="player-volume-slider" min="0" max="1" step="0.02" value="1" />
                    </div>
                  </div>

                  <button type="button" class="player-hud-btn" id="player-fs-btn" title="Fullscreen (F)">
                    <svg id="player-fs-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      const player = document.getElementById('custom-video-player');
      const video = document.getElementById('player-video');
      const playBtn = document.getElementById('player-play-btn');
      const stepBackBtn = document.getElementById('player-step-back-btn');
      const stepFwdBtn = document.getElementById('player-step-fwd-btn');
      const tcCurrent = document.getElementById('tc-current');
      const tcDuration = document.getElementById('tc-duration');
      const rateBtn = document.getElementById('player-rate-btn');
      const loopBtn = document.getElementById('player-loop-toggle-btn');
      const volumeBtn = document.getElementById('player-volume-toggle-btn');
      const volumeSlider = document.getElementById('player-volume-slider');
      const fsBtn = document.getElementById('player-fs-btn');
      const timeline = document.getElementById('player-timeline');
      const bufferBar = document.getElementById('timeline-buffer-bar');
      const progressBar = document.getElementById('timeline-progress-bar');
      const hoverBubble = document.getElementById('timeline-hover-bubble');

      activePlayerVideo = video;

      // Autoplay video
      video.play().then(() => {
        updatePlayIcon(true);
        resetPlayerIdleTimer(player, video);
      }).catch(() => {
        updatePlayIcon(false);
        player.classList.add('is-paused');
      });

      // Video playback events
      video.addEventListener('play', () => {
        updatePlayIcon(true);
        player.classList.remove('is-paused');
        resetPlayerIdleTimer(player, video);
      });

      video.addEventListener('pause', () => {
        updatePlayIcon(false);
        player.classList.add('is-paused');
        player.classList.remove('is-idle');
        if (activePlayerIdleTimer) clearTimeout(activePlayerIdleTimer);
      });

      video.addEventListener('ended', () => {
        if (!video.loop) {
          updatePlayIcon(false);
          player.classList.add('is-paused');
          player.classList.remove('is-idle');
        }
      });

      video.addEventListener('timeupdate', () => {
        if (!activePlayerScrubbing && video.duration) {
          const pct = (video.currentTime / video.duration) * 100;
          progressBar.style.width = `${pct}%`;
          tcCurrent.textContent = formatPlayerTime(video.currentTime);
        }
      });

      video.addEventListener('loadedmetadata', () => {
        tcDuration.textContent = formatPlayerTime(video.duration);
        tcCurrent.textContent = formatPlayerTime(video.currentTime);
      });

      video.addEventListener('progress', () => {
        if (video.duration && video.buffered.length > 0) {
          const bufferedEnd = video.buffered.end(video.buffered.length - 1);
          const bufPct = (bufferedEnd / video.duration) * 100;
          bufferBar.style.width = `${Math.min(100, bufPct)}%`;
        }
      });

      // Single Click (Play/Pause) vs Double Click (Fullscreen) on video
      video.addEventListener('click', (e) => {
        e.stopPropagation();
        if (activePlayerClickTimer) {
          clearTimeout(activePlayerClickTimer);
          activePlayerClickTimer = null;
          toggleCustomPlayerFullscreen();
        } else {
          activePlayerClickTimer = setTimeout(() => {
            activePlayerClickTimer = null;
            toggleCustomPlayerPlay();
          }, 240);
        }
      });

      // Mouse movements inside player HUD
      player.addEventListener('mousemove', () => resetPlayerIdleTimer(player, video));
      player.addEventListener('mouseleave', () => {
        if (!video.paused && !activePlayerScrubbing) {
          player.classList.add('is-idle');
        }
      });

      // Play / Pause button
      playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCustomPlayerPlay();
      });

      // Step Back / Forward
      stepBackBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        customPlayerSeek(-5);
      });
      stepFwdBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        customPlayerSeek(5);
      });

      // Rate button
      rateBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        currentRateIndex = (currentRateIndex + 1) % PLAYER_RATES.length;
        const newRate = PLAYER_RATES[currentRateIndex];
        video.playbackRate = newRate;
        rateBtn.textContent = `${newRate.toFixed(1)}×`;
        triggerPlayerPulse('text', `${newRate.toFixed(1)}×`);
      });

      // Loop button
      loopBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        video.loop = !video.loop;
        loopBtn.classList.toggle('active', video.loop);
        triggerPlayerPulse('text', video.loop ? 'LOOP ON' : 'LOOP OFF');
      });

      // Volume & Mute
      volumeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCustomPlayerMute();
      });

      volumeSlider.addEventListener('input', (e) => {
        e.stopPropagation();
        const val = parseFloat(e.target.value);
        video.volume = val;
        video.muted = (val === 0);
        updateVolumeIcon(video, volumeBtn);
      });

      // Fullscreen
      fsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleCustomPlayerFullscreen();
      });

      document.addEventListener('fullscreenchange', () => {
        const fsIcon = document.getElementById('player-fs-icon');
        if (!fsIcon) return;
        if (document.fullscreenElement) {
          fsIcon.innerHTML = `<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>`;
        } else {
          fsIcon.innerHTML = `<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>`;
        }
      });

      // Timeline hover & scrub
      function getTimelinePct(e) {
        const rect = timeline.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
        const x = Math.max(0, Math.min(rect.width, clientX - rect.left));
        return { pct: x / rect.width, x };
      }

      timeline.addEventListener('mousemove', (e) => {
        if (!video.duration) return;
        const { pct, x } = getTimelinePct(e);
        hoverBubble.style.left = `${x}px`;
        hoverBubble.textContent = formatPlayerTime(pct * video.duration);
      });

      function onScrubMove(e) {
        if (!activePlayerScrubbing || !video.duration) return;
        const { pct, x } = getTimelinePct(e);
        progressBar.style.width = `${pct * 100}%`;
        tcCurrent.textContent = formatPlayerTime(pct * video.duration);
        hoverBubble.style.left = `${x}px`;
        hoverBubble.textContent = formatPlayerTime(pct * video.duration);
        video.currentTime = pct * video.duration;
      }

      function onScrubEnd(e) {
        if (!activePlayerScrubbing) return;
        activePlayerScrubbing = false;
        player.classList.remove('is-scrubbing');
        window.removeEventListener('pointermove', onScrubMove);
        window.removeEventListener('pointerup', onScrubEnd);
        resetPlayerIdleTimer(player, video);
      }

      timeline.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (!video.duration) return;
        activePlayerScrubbing = true;
        player.classList.add('is-scrubbing');
        player.classList.remove('is-idle');
        const { pct, x } = getTimelinePct(e);
        progressBar.style.width = `${pct * 100}%`;
        tcCurrent.textContent = formatPlayerTime(pct * video.duration);
        video.currentTime = pct * video.duration;
        window.addEventListener('pointermove', onScrubMove);
        window.addEventListener('pointerup', onScrubEnd);
      });
    }

    // ============================================================
    // LIGHTBOX
    // ============================================================

    function openLightbox(item, folderItems = null) {
      activeLightboxItem = item;
      if (folderItems) {
        activeLightboxFolder = folderItems;
      } else {
        const card = getCard(item.id);
        activeLightboxFolder = card
          ? folderCards(folderRootId(card)).map(entry => currentItems.find(candidate => candidate.id === entry.dataset.id)).filter(Boolean)
          : [item];
      }
      folderLightboxIndex = Math.max(0, activeLightboxFolder.findIndex(entry => entry.id === item.id));
      const hasFolderNavigation = activeLightboxFolder.length > 1;
      document.getElementById('folder-lightbox-prev').hidden = !hasFolderNavigation;
      document.getElementById('folder-lightbox-next').hidden = !hasFolderNavigation;
      const lb = document.getElementById('lightbox');
      const container = document.getElementById('lightbox-media');

      if (item.type === 'video') {
        renderCustomVideoPlayer(container, item);
      } else if (item.type === 'youtube' || item.embed_type === 'youtube' || (item.url && item.url.includes('youtube.com'))) {
        cleanupCustomVideoPlayer();
        const ytId = item.videoId || item.embed_id || (item.url && (item.url.match(/(?:v=|\/embed\/|youtu\.be\/)([^"&?\/\s]{11})/) || [])[1]);
        if (!/^[a-zA-Z0-9_-]{11}$/.test(ytId || '')) return;
        container.innerHTML = `
          <div style="position:relative;display:inline-block;">
            <iframe src="https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1" style="width:85vw;height:80vh;border:none;border-radius:8px;box-shadow:0 35px 100px rgba(0,0,0,0.95);" allow="autoplay; fullscreen" allowfullscreen></iframe>
            <button type="button" class="player-hud-btn player-close-btn" style="position:absolute;top:12px;right:12px;z-index:10;" title="Close (Esc)" onclick="closeLightbox()">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        `;
      } else if (item.type === 'vimeo') {
        cleanupCustomVideoPlayer();
        const videoId = String(item.videoId || '');
        if (!/^\d+$/.test(videoId)) return;
        container.innerHTML = `<iframe src="https://player.vimeo.com/video/${videoId}?autoplay=1" title="${escapeHtml(item.title || 'Vimeo video')}" style="width:85vw;height:80vh;border:0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
      } else {
        cleanupCustomVideoPlayer();
        const imgSrc = item.img_src || item.poster || item.url || '';
        container.innerHTML = `
          <div style="position:relative;display:inline-block;">
            <img src="${escapeHtml(imgSrc)}" referrerpolicy="no-referrer" alt="${escapeHtml(item.title || 'Moodboard image')}" />
            <button type="button" class="player-hud-btn player-close-btn" style="position:absolute;top:12px;right:12px;z-index:10;" title="Close (Esc)" onclick="closeLightbox()">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        `;
      }
      lb.classList.add('active');
    }

    function navigateFolderLightbox(direction) {
      if (activeLightboxFolder.length < 2) return;
      const items = activeLightboxFolder;
      const nextIndex = (folderLightboxIndex + direction + items.length) % items.length;
      openLightbox(items[nextIndex], items);
    }

    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      const container = document.getElementById('lightbox-media');
      cleanupCustomVideoPlayer();
      container.innerHTML = '';
      lb.classList.remove('active');
      activeLightboxItem = null;
      activeLightboxFolder = [];
      document.getElementById('folder-lightbox-prev').hidden = true;
      document.getElementById('folder-lightbox-next').hidden = true;
    }

    // ============================================================
    // ACTION & UNDO STATUS READOUT (Zero-UI Ghost Typography)
    // ============================================================

    let toastTimeout = null;
    function showToast(msg, isError = false) {
      let formattedMsg = msg;
      if (msg.startsWith('Switched to: ')) {
        const board = msg.replace('Switched to: ', '').trim();
        const displayBoard = board.charAt(0).toUpperCase() + board.slice(1);
        formattedMsg = `Switched to ${displayBoard}`;
      }

      // Check if undo is available and append subtle cmd+z hint
      if (!isError && typeof undoStack !== 'undefined' && undoStack.length > 0 && !formattedMsg.includes('⌘Z') && !formattedMsg.includes('Undo') && !formattedMsg.includes('Redo')) {
        toastMessage.innerHTML = `${formattedMsg} <span style="opacity: 0.45; margin-left: 6px;">· ⌘Z</span>`;
      } else {
        toastMessage.textContent = formattedMsg;
      }

      toast.className = isError ? 'active error' : 'active';
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.className = '';
      }, 3000);
    }

    // ============================================================
    // INITIALIZATION
    // ============================================================

    async function init() {
      // Check URL hash for initial board e.g. #board=trakoscan
      const hashMatch = window.location.hash.match(/board=([^&]+)/);
      if (hashMatch && hashMatch[1]) {
        activeBoardId = decodeURIComponent(hashMatch[1]);
      } else {
        try {
          const saved = localStorage.getItem(STORAGE_KEY_ACTIVE_BOARD);
          if (saved) activeBoardId = saved;
        } catch(e) {}
      }

      await loadBoardsList();
      const hasCamera = loadCamera();
      updateCamera();
      await loadActiveBoard();
      if (!hasCamera) focusOpeningFrame();
    }

    init();
  </script>

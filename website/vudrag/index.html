<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Spatial Moodboard — Studio Varaždin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --bg-base: #060608;
      --bg-surface: #0e0e12;
      --accent-gold: #c5a059;
      --accent-blue: #0a84ff;
      --accent-blue-hover: #0071e3;
      --accent-danger: #ff453a;
      --card-border: rgba(255, 255, 255, 0.035);
      --card-border-hover: #5beeff;
      --text-main: #f5f5f7;
      --text-muted: #86868b;
      --shadow-base: 0 16px 40px rgba(0, 0, 0, 0.7);
      --shadow-active: 0 28px 70px rgba(0, 0, 0, 0.95);
      --command-bg: rgba(24, 24, 28, 0.88);
      --command-border: rgba(255, 255, 255, 0.12);
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      cursor: default;
    }

    body.panning,
    body.middle-panning {
      cursor: grabbing !important;
    }

    /* Spatial Canvas Viewport */
    #viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      background:
        radial-gradient(ellipse 65% 55% at 17% 22%, rgba(78, 17, 12, 0.28), transparent 72%),
        radial-gradient(ellipse 55% 70% at 82% 84%, rgba(144, 86, 21, 0.10), transparent 75%),
        #080909;
    }

    #world {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* ============================================================
       ZERO-UI PURE MEDIA CARDS (No badges, no labels, no overlays)
       ============================================================ */
    .media-card {
      position: absolute;
      transform-origin: center center;
      cursor: default;
      border-radius: 1px;
      background-color: var(--bg-surface);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow-base);
      will-change: transform, width, height;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
      overflow: visible;
    }

    .media-card:hover,
    .media-card.is-selected,
    .media-card:focus-visible {
      border-color: var(--card-border-hover);
      box-shadow: var(--shadow-active), 0 0 9px rgba(52, 230, 255, 0.55), 0 0 32px rgba(36, 223, 250, 0.28);
      z-index: 10000 !important;
    }

    .media-card.dragging {
      cursor: grabbing !important;
      border-color: rgba(255, 255, 255, 0.6) !important;
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.98) !important;
      z-index: 20000 !important;
    }

    .media-card.is-resizing {
      border-color: #5beeff !important;
      box-shadow: var(--shadow-active), 0 0 16px rgba(52, 230, 255, 0.75), 0 0 45px rgba(36, 223, 250, 0.45) !important;
      z-index: 25000 !important;
      transition: none !important;
    }

    /* Golden Harmonic Glow on Aspect Ratio Lock */
    .media-card.is-aspect-snapped {
      border-color: #ffd700 !important;
      box-shadow: 0 0 0 1px rgba(255, 215, 0, 0.75),
                  0 0 18px rgba(255, 215, 0, 0.65),
                  0 0 48px rgba(255, 200, 0, 0.38),
                  var(--shadow-active) !important;
      transition: border-color 0.12s ease, box-shadow 0.12s ease !important;
    }

    body.is-resizing {
      user-select: none !important;
      -webkit-user-select: none !important;
    }

    /* Zero-UI Subtle Card Resize Handles */
    .card-resize-handle {
      position: absolute;
      box-sizing: border-box;
      pointer-events: auto;
      z-index: 120;
      opacity: 0;
      transition: opacity 0.22s cubic-bezier(0.16, 1, 0.3, 1), transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    /* Corner handles: 8x8px subtle frosted squares */
    .card-resize-handle.handle-nw,
    .card-resize-handle.handle-ne,
    .card-resize-handle.handle-se,
    .card-resize-handle.handle-sw {
      width: 8px;
      height: 8px;
      background: rgba(12, 14, 18, 0.88);
      border: 1.5px solid rgba(91, 238, 255, 0.75);
      border-radius: 1.5px;
      box-shadow: 0 0 6px rgba(52, 230, 255, 0.3);
      transform: translate(-50%, -50%) scale(0.85);
    }

    .card-resize-handle.handle-nw { top: 0; left: 0; cursor: nwse-resize; }
    .card-resize-handle.handle-ne { top: 0; left: 100%; cursor: nesw-resize; }
    .card-resize-handle.handle-se { top: 100%; left: 100%; cursor: nwse-resize; }
    .card-resize-handle.handle-sw { top: 100%; left: 0; cursor: nesw-resize; }

    /* Edge handles: subtle hairline bars */
    .card-resize-handle.handle-n,
    .card-resize-handle.handle-s {
      height: 5px;
      width: 24px;
      background: rgba(91, 238, 255, 0.45);
      border-radius: 2.5px;
      transform: translate(-50%, -50%) scale(0.8);
      cursor: ns-resize;
    }
    .card-resize-handle.handle-n { top: 0; left: 50%; }
    .card-resize-handle.handle-s { top: 100%; left: 50%; }

    .card-resize-handle.handle-e,
    .card-resize-handle.handle-w {
      width: 5px;
      height: 24px;
      background: rgba(91, 238, 255, 0.45);
      border-radius: 2.5px;
      transform: translate(-50%, -50%) scale(0.8);
      cursor: ew-resize;
    }
    .card-resize-handle.handle-w { top: 50%; left: 0; }
    .card-resize-handle.handle-e { top: 50%; left: 100%; }

    /* Subtle reveal on card hover */
    .media-card:hover .card-resize-handle {
      opacity: 0.45;
      transform: translate(-50%, -50%) scale(0.9);
    }

    /* Crisp, active affordance on selected card */
    .media-card.is-selected .card-resize-handle {
      opacity: 0.95;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Luminous glow on handle hover or active resize */
    .card-resize-handle:hover,
    .card-resize-handle.is-active,
    .media-card.is-resizing .card-resize-handle {
      opacity: 1 !important;
      background: #5beeff !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 10px rgba(91, 238, 255, 0.9), 0 0 20px rgba(52, 230, 255, 0.5) !important;
      transform: translate(-50%, -50%) scale(1.25) !important;
    }

    /* Golden Harmonic Glow on Handles when Snapped */
    .media-card.is-aspect-snapped .card-resize-handle {
      opacity: 1 !important;
      background: #ffd700 !important;
      border-color: #ffffff !important;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.95), 0 0 24px rgba(255, 215, 0, 0.6) !important;
      transform: translate(-50%, -50%) scale(1.35) !important;
    }

    /* Folder stacked cards hide handles */
    .media-card.folder-member:not(.is-selected) .card-resize-handle {
      display: none !important;
    }

    .media-card.folder-member {
      transition: transform 650ms cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .media-card.folder-member.dragging {
      transition: none;
    }

    .media-card.folder-drop-target {
      border-color: rgba(10, 132, 255, 0.85);
      box-shadow: 0 0 0 5px rgba(10, 132, 255, 0.16), var(--shadow-active);
    }

    .media-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      background: #09090b;
    }

    .media-card.video-card {
      background: #000;
    }

    .media-card.video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .media-card.video-card iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
      border-radius: 1px;
    }

    /* Optimistic Upload Placeholder */
    .media-card.placeholder-card {
      border: 1px dashed rgba(255, 255, 255, 0.35);
      background: rgba(18, 18, 24, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      animation: pulseBorder 1.5s infinite alternate ease-in-out;
    }

    @keyframes pulseBorder {
      0% { border-color: rgba(255, 255, 255, 0.2); }
      100% { border-color: rgba(255, 255, 255, 0.7); }
    }

    .placeholder-spinner {
      width: 26px;
      height: 26px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top: 2px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Rubber-band Marquee Selection Box */
    #selection-marquee {
      position: fixed;
      border: 1px solid rgba(91, 238, 255, 0.65);
      background: rgba(91, 238, 255, 0.08);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      box-shadow: 0 0 16px rgba(52, 230, 255, 0.2), inset 0 0 12px rgba(52, 230, 255, 0.05);
      pointer-events: none;
      z-index: 99990;
      border-radius: 2px;
      display: none;
      will-change: top, left, width, height;
    }

    /* ============================================================
       SHAPER 3D COMMAND PALETTE MODAL (Spacebar Trigger)
       ============================================================ */
    #command-backdrop {
      position: fixed;
      inset: 0;
      box-sizing: border-box;
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(20px) brightness(0.7);
      -webkit-backdrop-filter: blur(20px) brightness(0.7);
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    #command-backdrop.active {
      display: flex;
      opacity: 1;
    }

    #command-modal {
      position: relative;
      width: 850px;
      max-width: 100%;
      margin-inline: auto;
      background: transparent;
      border: 0;
      overflow: visible;
      display: flex;
      flex-direction: column;
      transform: translateY(-8px);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #command-backdrop.active #command-modal {
      transform: translateY(0);
    }

    #command-modal::after {
      content: '';
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      bottom: 0;
      height: 145px;
      border-radius: 0 0 27px 27px;
      background: linear-gradient(to bottom, transparent, rgba(4, 6, 6, 0.72) 55%, rgba(4, 6, 6, 0.94));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      -webkit-mask-image: linear-gradient(to bottom, transparent, #000 55%);
      mask-image: linear-gradient(to bottom, transparent, #000 55%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #command-modal.fade-tail::after {
      opacity: 1;
    }

    /* Search Bar Header */
    .command-header {
      display: flex;
      align-items: center;
      flex: 0 0 94px;
      padding: 0 29px;
      position: relative;
      background: transparent;
    }

    .command-search-icon {
      width: 32px;
      height: 32px;
      color: #b9bdbe;
      margin-right: 27px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .command-search-icon svg {
      width: 32px;
      height: 32px;
    }

    .command-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      min-width: 0;
      font-size: 36px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .command-input::placeholder {
      color: #a6a9a8;
      font-weight: 400;
    }

    .command-input:placeholder-shown {
      caret-color: transparent;
    }

    .command-clear-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #a1a1aa;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      transition: background 0.15s;
    }

    .command-clear-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .command-clear-btn.visible {
      display: flex;
    }

    #command-backdrop.create-board-mode .command-search-icon {
      display: none;
    }

    /* Command Results List */
    .command-list {
      position: relative;
      max-height: min(560px, calc(100vh - 175px));
      overflow-y: auto;
      scrollbar-width: none;
      padding: 0 6px 145px;
      display: flex;
      flex-direction: column;
      gap: 0;
      border-radius: 27px;
      background: linear-gradient(to bottom, rgba(25, 32, 31, 0.2), rgba(8, 11, 11, 0.5));
      backdrop-filter: blur(32px) saturate(110%);
      -webkit-backdrop-filter: blur(32px) saturate(110%);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.22);
    }

    .command-list:empty {
      display: none;
    }

    .command-list::-webkit-scrollbar {
      display: none;
    }

    .command-selection {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 6px;
      right: 6px;
      height: 76px;
      border: 1px solid rgba(100, 232, 246, 0.4);
      border-radius: 22px;
      background: rgba(133, 203, 211, 0.045);
      box-shadow: 0 0 13px rgba(72, 219, 239, 0.16), inset 0 0 18px rgba(83, 213, 230, 0.035);
      pointer-events: none;
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1), height 180ms cubic-bezier(0.16, 1, 0.3, 1), opacity 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      will-change: transform;
    }

    .command-selection.on-active {
      border-color: rgba(100, 232, 246, 0.18);
      background: rgba(133, 203, 211, 0.018);
      box-shadow: 0 0 6px rgba(72, 219, 239, 0.09);
    }

    .command-selection.is-instant {
      transition: none;
    }

    .command-item {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: 0 0 76px;
      min-height: 76px;
      padding: 0 25px;
      border: 1px solid transparent;
      border-radius: 22px;
      cursor: pointer;
      color: #c9cdcd;
      transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      font-size: 38px;
      font-weight: 400;
      letter-spacing: -0.03em;
    }

    .command-item.group-start {
      margin-top: 0;
    }

    .command-item.active-board {
      flex-basis: 80px;
      min-height: 80px;
      background: rgba(135, 210, 216, 0.012);
      border-color: rgba(100, 232, 246, 0.09);
      color: #d6dada;
    }

    .command-item.active-board .command-item-icon {
      color: #c5caca;
    }

    .command-item.primary-action {
      color: #fff;
    }

    .command-item.primary-action .command-item-icon {
      color: #fff;
    }

    .command-item-left {
      display: flex;
      align-items: center;
      gap: 27px;
      min-width: 0;
      flex: 1;
    }

    .command-item-icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #abb0b0;
      flex-shrink: 0;
    }

    .command-item-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .command-item-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command-item-shortcut {
      flex-shrink: 0;
      min-width: 62px;
      margin-left: 16px;
      padding: 5px 9px;
      border-radius: 9px;
      background: rgba(85, 90, 90, 0.32);
      color: #aeb4b4;
      font-size: 20px;
      line-height: 1.25;
      text-align: center;
      letter-spacing: -0.02em;
    }

    /* Selected Item (Shaper 3D Accent) */
    .command-item.selected {
      color: #e8eded;
    }

    .command-item.selected .command-item-icon,
    .command-item.active-board.selected .command-item-icon {
      color: #e3e9e9;
    }

    .command-empty-state {
      padding: 34px 20px;
      text-align: center;
      color: #8e8e93;
      font-size: 24px;
    }


    /* ============================================================
       LIGHTBOX & ZERO-UI CUSTOM VIDEO PLAYER
       ============================================================ */
    #lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99990;
      cursor: zoom-out;
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #lightbox.active {
      display: flex;
      opacity: 1;
    }

    #lightbox-container {
      position: relative;
      max-width: 92vw;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: default;
    }

    #lightbox-media img {
      max-width: 92vw;
      max-height: 85vh;
      border-radius: 6px;
      box-shadow: 0 35px 100px rgba(0,0,0,0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      object-fit: contain;
      display: block;
    }

    .folder-lightbox-nav {
      position: fixed;
      top: 50%;
      width: 48px;
      height: 48px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 50%;
      background: rgba(24,24,28,.62);
      color: #fff;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(18px);
      transform: translateY(-50%);
      z-index: 2;
    }
    .folder-lightbox-nav.prev { left: 3vw; }
    .folder-lightbox-nav.next { right: 3vw; }
    .folder-lightbox-nav[hidden] { display: none; }
    .folder-lightbox-nav:hover { background: rgba(55,55,65,.9); }
    @media (max-width: 600px) {
      .folder-lightbox-nav { width: 38px; height: 38px; font-size: 24px; }
      .folder-lightbox-nav.prev { left: 1vw; }
      .folder-lightbox-nav.next { right: 1vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      .media-card.folder-member { transition-duration: 0.01ms; }
    }

    /* Zero-UI Custom Video Player */
    .custom-video-player {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      border-radius: 8px;
      overflow: hidden;
      max-width: 92vw;
      max-height: 85vh;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.98), 0 0 0 1px rgba(255, 255, 255, 0.04);
      user-select: none;
      -webkit-user-select: none;
    }

    .custom-video-player:fullscreen {
      max-width: 100vw;
      max-height: 100vh;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }

    .custom-video-player video {
      max-width: 92vw;
      max-height: 85vh;
      display: block;
      object-fit: contain;
      cursor: pointer;
      background: #000;
      outline: none;
    }

    .custom-video-player:fullscreen video {
      max-width: 100vw;
      max-height: 100vh;
      width: 100vw;
      height: 100vh;
    }

    /* Idle / Auto-Hide State */
    .custom-video-player.is-idle {
      cursor: none !important;
    }

    .custom-video-player.is-idle video {
      cursor: none !important;
    }

    .custom-video-player.is-idle .player-hud {
      opacity: 0;
      pointer-events: none;
    }

    /* Center Pulse Feedback Glyph */
    .player-center-pulse {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
    }

    .player-center-pulse.animate {
      animation: pulsePop 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pulsePop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.65);
      }
      35% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.05);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.35);
      }
    }

    .pulse-icon-box {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(12, 12, 16, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
    }

    /* Floating HUD Overlay */
    .player-hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;

  <script>

     */

    const API_ENDPOINT = 'api/board.php';
    const STORAGE_PREFIX_POS = 'sv_mb_pos_';

    // ============================================================
    // FUZZY TYPO-TOLERANT SEARCH ENGINE
    // ============================================================

    class FuzzyEngine {
      static normalize(text) {
        if (!text) return '';
        return text
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '') // remove diacritics: č,ć,ž,š,đ -> c,c,z,s,d
          .replace(/[^a-z0-9\s]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      // Damerau-Levenshtein distance for short typo tolerance
      static levenshtein(a, b) {
        const al = a.length;
        const bl = b.length;
        if (al === 0) return bl;
        if (bl === 0) return al;
        const matrix = [];
        for (let i = 0; i <= bl; i++) matrix[i] = [i];
        for (let j = 0; j <= al; j++) matrix[0][j] = j;

        for (let i = 1; i <= bl; i++) {
          for (let j = 1; j <= al; j++) {
            if (b.charAt(i - 1) === a.charAt(j - 1)) {
              matrix[i][j] = matrix[i - 1][j - 1];
            } else {
              matrix[i][j] = Math.min(
                matrix[i - 1][j - 1] + 1, // substitution
                matrix[i][j - 1] + 1,     // insertion
                matrix[i - 1][j] + 1      // deletion
              );
              // Transposition check
              if (i > 1 && j > 1 && b.charAt(i - 1) === a.charAt(j - 2) && b.charAt(i - 2) === a.charAt(j - 1)) {
                matrix[i][j] = Math.min(matrix[i][j], matrix[i - 2][j - 2] + 1);
              }
            }
          }
        }
        return matrix[bl][al];
      }

      // Fuzzy score calculation
      static matchScore(targetStr, queryTokens) {
        const normTarget = this.normalize(targetStr);
        if (!normTarget) return 0;
        const targetWords = normTarget.split(' ');

        let totalScore = 0;

        for (const qToken of queryTokens) {
          if (!qToken) continue;
          let bestTokenScore = 0;

          // 1. Exact full substring match in target
          if (normTarget.includes(qToken)) {
            if (normTarget.startsWith(qToken)) {
              bestTokenScore = Math.max(bestTokenScore, 100);
            } else {
              bestTokenScore = Math.max(bestTokenScore, 75);
            }
          }

          // 2. Word-level prefix and typo matching
          for (const tWord of targetWords) {
            if (tWord.startsWith(qToken)) {
              bestTokenScore = Math.max(bestTokenScore, 90);
            } else if (tWord.includes(qToken)) {
              bestTokenScore = Math.max(bestTokenScore, 60);
            } else if (qToken.length >= 3 && tWord.length >= 3) {
              const dist = this.levenshtein(qToken, tWord);
              const maxAllowed = qToken.length <= 4 ? 1 : 2;
              if (dist <= maxAllowed) {
                bestTokenScore = Math.max(bestTokenScore, 50 - dist * 15);
              }
            }
          }

          // 3. Subsequence match (e.g. "shpr" in "shaper")
          if (bestTokenScore === 0 && qToken.length >= 3) {
            let tIdx = 0;
            let matchedChars = 0;
            for (let i = 0; i < qToken.length; i++) {
              const char = qToken[i];
              const found = normTarget.indexOf(char, tIdx);
              if (found !== -1) {
                matchedChars++;
                tIdx = found + 1;
              }
            }
            if (matchedChars === qToken.length) {
              bestTokenScore = 30;
            }
          }

          if (bestTokenScore === 0) {
            // One token didn't match anything in this target
            return 0;
          }
          totalScore += bestTokenScore;
        }

        return totalScore;
      }
    }

    function openCommandBar() {

    function closeCommandBar() {
      isCommandBarOpen = false;
      activeSubmode = null;
      if (paletteScrollRaf) {
        cancelAnimationFrame(paletteScrollRaf);
        paletteScrollRaf = null;
      }
      commandBackdrop.classList.remove('create-board-mode');
      commandBackdrop.classList.remove('active');
      commandInput.blur();

    function toggleCommandBar() {

    // Cubic-bezier easing evaluator matching CSS cubic-bezier(0.22, 1, 0.36, 1)
    function createCubicBezier(x1, y1, x2, y2) {
      const cx = 3 * x1;
      const bx = 3 * (x2 - x1) - cx;
      const ax = 1 - cx - bx;

      const cy = 3 * y1;
      const by = 3 * (y2 - y1) - cy;
      const ay = 1 - cy - by;

      function sampleCurveX(t) { return ((ax * t + bx) * t + cx) * t; }
      function sampleCurveY(t) { return ((ay * t + by) * t + cy) * t; }
      function sampleCurveDerivativeX(t) { return (3 * ax * t + 2 * bx) * t + cx; }

      function solveCurveX(x) {
        let t2 = x;
        for (let i = 0; i < 8; i++) {
          const x2 = sampleCurveX(t2) - x;
          if (Math.abs(x2) < 1e-5) return t2;
          const d2 = sampleCurveDerivativeX(t2);
          if (Math.abs(d2) < 1e-5) break;
          t2 = t2 - x2 / d2;
        }
        let t0 = 0, t1 = 1;
        t2 = x;
        while (t0 < t1) {
          const x2 = sampleCurveX(t2);
          if (Math.abs(x2 - x) < 1e-5) return t2;
          if (x > x2) t0 = t2;
          else t1 = t2;
          t2 = (t1 - t0) * 0.5 + t0;
        }
        return t2;
      }

      return function(x) {
        if (x <= 0) return 0;
        if (x >= 1) return 1;
        return sampleCurveY(solveCurveX(x));
      };
    }

    const paletteEase = createCubicBezier(0.22, 1, 0.36, 1);

    let paletteScrollRaf = null;
    let paletteTargetScroll = 0;
    let paletteLastTime = 0;

    function smoothScrollListTo(targetScrollTop, animate = true) {
      if (!commandList) return;
      const maxScroll = Math.max(0, commandList.scrollHeight - commandList.clientHeight);
      const clampedTarget = Math.max(0, Math.min(targetScrollTop, maxScroll));

      paletteTargetScroll = clampedTarget;

      if (!animate) {
        if (paletteScrollRaf) {
          cancelAnimationFrame(paletteScrollRaf);
          paletteScrollRaf = null;
        }
        commandList.scrollTop = clampedTarget;
        return;
      }

      if (paletteScrollRaf) {
        // Continuous tracking: target updated, running loop smoothly glides without restart jank
        return;
      }

      if (Math.abs(commandList.scrollTop - clampedTarget) < 1) {
        commandList.scrollTop = clampedTarget;
        return;
      }

      paletteLastTime = performance.now();

      function step(now) {
        const dt = Math.min(0.064, (now - paletteLastTime) / 1000);
        paletteLastTime = now;

        const current = commandList.scrollTop;
        const diff = paletteTargetScroll - current;

        if (Math.abs(diff) < 0.5) {
          commandList.scrollTop = paletteTargetScroll;
          paletteScrollRaf = null;
          return;
        }

        // High-performance critically damped continuous glide (lambda = 20)
        const factor = 1 - Math.exp(-20 * dt);
        commandList.scrollTop = current + diff * factor;

        paletteScrollRaf = requestAnimationFrame(step);
      }

      paletteScrollRaf = requestAnimationFrame(step);
    }

    commandList.addEventListener('wheel', () => {
      if (paletteScrollRaf) {
        cancelAnimationFrame(paletteScrollRaf);
        paletteScrollRaf = null;
      }
    }, { passive: true });

    commandList.addEventListener('touchstart', () => {
      if (paletteScrollRaf) {
        cancelAnimationFrame(paletteScrollRaf);
        paletteScrollRaf = null;
      }
    }, { passive: true });

    // Filter & Render list
    function renderCommandResults(query) {
      if (activeSubmode) return;

      const normQuery = FuzzyEngine.normalize(query);
      const tokens = normQuery.split(' ').filter(t => t.length > 0);
      const masterList = getMasterCommandList();

      if (tokens.length === 0) {
        // Keep the palette compact until the user searches for a specific frame.
        filteredCommands = masterList.filter(cmd => cmd.category !== 'MEDIA ON THIS BOARD');
      } else {
        // Score every command
        const scored = [];
        masterList.forEach(cmd => {
          let searchBlob = `${cmd.title} ${(cmd.keywords || []).join(' ')} ${cmd.category}`;
          const score = FuzzyEngine.matchScore(searchBlob, tokens);
          if (score > 0) {
            scored.push({ cmd, score });
          }
        });

        scored.sort((a, b) => b.score - a.score);
        filteredCommands = scored.map(s => s.cmd);
      }

      if (filteredCommands.length === 0) {
        commandList.parentElement.classList.remove('fade-tail');
        commandList.innerHTML = `
          <div class="command-empty-state">
            No results
          </div>
        `;
        selectedIndex = 0;
        return;
      }

      let html = '<div class="command-selection is-instant" aria-hidden="true"></div>';
      let currentCategory = '';
      selectedIndex = Math.min(selectedIndex, filteredCommands.length - 1);
      if (selectedIndex < 0) selectedIndex = 0;
      commandList.parentElement.classList.toggle('fade-tail', filteredCommands.length > 5);

      filteredCommands.forEach((cmd, idx) => {
        let groupStart = false;
        if (cmd.category !== currentCategory) {
          groupStart = currentCategory !== '' && tokens.length === 0;
          currentCategory = cmd.category;
        }

        const isSel = idx === selectedIndex;
        html += `
          <div class="command-item ${isSel ? 'selected' : ''} ${cmd.isActiveBoard ? 'active-board' : ''} ${cmd.id === 'action_create_board' ? 'primary-action' : ''} ${groupStart ? 'group-start' : ''}" data-index="${idx}" ${cmd.isActiveBoard ? 'aria-current="true"' : ''} onclick="executeCommandByIndex(${idx})" onmouseenter="onCommandItemHover(${idx})">
            <div class="command-item-left">
              <div class="command-item-icon">${cmd.icon}</div>
              <div class="command-item-title">${escapeHtml(cmd.title)}</div>
            </div>
            ${cmd.shortcut ? `<div class="command-item-shortcut">${escapeHtml(cmd.shortcut)}</div>` : ''}
          </div>
        `;
      });

      commandList.innerHTML = html;
      positionSelectionHighlight(false);
      scrollSelectedItemIntoView(false);
    }

    function positionSelectionHighlight(animate = true) {
      const highlight = commandList.querySelector('.command-selection');
      const selectedEl = commandList.querySelector('.command-item.selected');
      if (!highlight || !selectedEl) return;
      if (!animate) highlight.classList.add('is-instant');
      highlight.style.transform = `translate3d(0, ${selectedEl.offsetTop}px, 0)`;
      highlight.style.height = `${selectedEl.offsetHeight}px`;
      highlight.classList.toggle('on-active', selectedEl.classList.contains('active-board'));
      if (!animate) {
        void highlight.offsetHeight;
        requestAnimationFrame(() => highlight.classList.remove('is-instant'));
      }
    }

    function scrollSelectedItemIntoView(animate = true) {
      const selectedEl = commandList.querySelector('.command-item.selected');
      if (!selectedEl || !commandList) return;

      const listHeight = commandList.clientHeight;
      const scrollHeight = commandList.scrollHeight;
      if (scrollHeight <= listHeight) {
        if (commandList.scrollTop !== 0) {
          smoothScrollListTo(0, animate);
        }
        return;
      }

      const itemTop = selectedEl.offsetTop;
      const itemHeight = selectedEl.offsetHeight;
      const itemBottom = itemTop + itemHeight;
      const currentScroll = commandList.scrollTop;

      const topPadding = 16;
      // 145px bottom clearance ensures the selected item is always kept in the unblurred clear glass area
      const bottomPadding = 145;

      let targetScroll = currentScroll;

      if (selectedIndex === 0) {
        targetScroll = 0;
      } else if (itemTop - topPadding < currentScroll) {
        targetScroll = Math.max(0, itemTop - topPadding);
      } else if (itemBottom + bottomPadding > currentScroll + listHeight) {
        targetScroll = Math.min(scrollHeight - listHeight, itemBottom + bottomPadding - listHeight);
      }

      if (Math.abs(targetScroll - currentScroll) >= 1) {
        smoothScrollListTo(targetScroll, animate);
      }
    }

    function onCommandItemHover(idx) {
      if (selectedIndex === idx) return;
      selectedIndex = idx;
      const items = commandList.querySelectorAll('.command-item');
      items.forEach((el, i) => {
        el.classList.toggle('selected', i === selectedIndex);
      });
      commandList.parentElement.classList.toggle('fade-tail', filteredCommands.length > 5);
      positionSelectionHighlight(true);
    }

    function executeCommandByIndex(index) {
      if (filteredCommands[index] && typeof filteredCommands[index].action === 'function') {
        const action = filteredCommands[index].action;
        action();
        if (!activeSubmode) closeCommandBar();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ============================================================
    // KEYBOARD LISTENER & SPACEBAR TRIGGER
    // ============================================================

    commandInput.addEventListener('input', (e) => {
      const val = e.target.value;
      commandClearBtn.classList.toggle('visible', val.length > 0);
      if (!activeSubmode) {
        selectedIndex = val.trim() ? 0 : Math.max(0, availableBoards.findIndex(board => board.id === activeBoardId));
        renderCommandResults(val);
      }
    });

    commandInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        if (activeSubmode) {
          exitSubmode();
        } else {
          closeCommandBar();
        }
        return;
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        if (activeSubmode) {
          executeSubmodeInput(commandInput.value);
        } else if (filteredCommands[selectedIndex]) {
          executeCommandByIndex(selectedIndex);
        }
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (filteredCommands.length > 0) {
          selectedIndex = Math.min(filteredCommands.length - 1, selectedIndex + 1);
          updateSelectedCommandUI(true);
        }
        return;
      }

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (filteredCommands.length > 0) {
          selectedIndex = Math.max(0, selectedIndex - 1);
          updateSelectedCommandUI(true);
        }
        return;
      }
    });

    function updateSelectedCommandUI(animate = true) {
      const items = commandList.querySelectorAll('.command-item');
      items.forEach((el, idx) => {
        el.classList.toggle('selected', idx === selectedIndex);
      });
      commandList.parentElement.classList.toggle('fade-tail', filteredCommands.length > 5);
      positionSelectionHighlight(animate);
      scrollSelectedItemIntoView(animate);
    }

    // Add shortcuts here; palette actions remain the single source of command behavior.
    const canvasShortcuts = [
      { key: 'a', mod: true, command: 'edit_select_all' },
      { key: 'z', mod: true, shift: false, command: 'edit_undo' },
      { key: 'z', mod: true, shift: true, command: 'edit_redo' },
      { key: 'y', mod: true, command: 'edit_redo' },
      { key: 'delete', command: 'edit_delete_card' },
      { key: 'backspace', command: 'edit_delete_card' },
      { key: 'g', command: 'edit_group_selected' },
      { key: 'e', command: 'edit_toggle_folder' },
      { key: '+', command: 'edit_scale_up' },
      { key: '=', command: 'edit_scale_up' },
      { key: '+', mod: true, command: 'edit_scale_up' },
      { key: '=', mod: true, command: 'edit_scale_up' },
      { key: '-', command: 'edit_scale_down' },
      { key: '_', command: 'edit_scale_down' },
      { key: '-', mod: true, command: 'edit_scale_down' },
      { key: '_', mod: true, command: 'edit_scale_down' },
      { key: 'r', command: 'view_center' },
      { key: 'f', command: 'view_fullscreen' },
      { key: 'i', mod: true, command: 'action_add_images' },
      { key: '0', mod: true, command: 'view_fit_all' },
      { key: 'n', mod: true, action: () => { openCommandBar(); enterSubmode('create_board'); } },
      { key: 'l', mod: true, action: () => { openCommandBar(); enterSubmode('add_link'); } }
    ];

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      const mod = e.metaKey || e.ctrlKey;
      const editable = e.target.closest('input, textarea, select, [contenteditable="true"]');

      if (mod && key === 'k') {
        e.preventDefault();
        toggleCommandBar();
        return;
      }
      if (editable || isCommandBarOpen) return;
      if (activeLightboxItem) {
        if (activeLightboxFolder.length > 1 && (key === 'arrowleft' || key === 'arrowright') && (activeLightboxItem.type !== 'video' || e.shiftKey)) {
          e.preventDefault();
          navigateFolderLightbox(key === 'arrowleft' ? -1 : 1);
          return;
        }
        if (activeLightboxItem.type === 'video' && handlePlayerKeydown(e)) return;
        if (key === 'escape') { e.preventDefault(); closeLightbox(); }
        return;
      }
      if (e.code === 'Space' && !mod && !e.altKey) {
        e.preventDefault();
        openCommandBar();
        return;
      }
      if (key === 'escape') {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else {
          selectCard(null);
          closeAllFolders();
        }
        return;
      }
      const shortcut = canvasShortcuts.find(entry =>
        entry.key === key && Boolean(entry.mod) === Boolean(mod) &&
        (entry.shift === undefined || entry.shift === e.shiftKey) && !e.altKey
      );
      if (!shortcut) return;
      e.preventDefault();
      if (e.repeat && ['edit_delete_card', 'edit_undo', 'edit_redo'].includes(shortcut.command)) return;
      const action = shortcut.action || getMasterCommandList().find(command => command.id === shortcut.command)?.action;
      if (action) action();
    });

    // ============================================================
    // CANVAS CAMERA & SPATIAL ENGINE
    // ============================================================

    function updateCamera() {
      world.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
      if (expandedFolders.size) expandedFolders.forEach(layoutFolder);
    }

    function saveCamera() {
      try {
        localStorage.setItem(`${STORAGE_PREFIX_CAMERA}${activeBoardId}`, JSON.stringify({
          panX, panY, scale, viewportW: window.innerWidth, viewportH: window.innerHeight
        }));
      } catch(e) {}
    }

    function loadCamera() {
      try {
        const raw = localStorage.getItem(`${STORAGE_PREFIX_CAMERA}${activeBoardId}`);
        if (raw) {
          const c = JSON.parse(raw);
          if (Number.isFinite(c.panX) && Number.isFinite(c.panY) && Number.isFinite(c.scale)
              && Number.isFinite(c.viewportW) && Number.isFinite(c.viewportH)) {
            const widthRatio = window.innerWidth / c.viewportW;
            const heightRatio = window.innerHeight / c.viewportH;
            if (widthRatio >= 0.75 && widthRatio <= 1.33 && heightRatio >= 0.75 && heightRatio <= 1.33) {
              const centerX = (c.viewportW / 2 - c.panX) / c.scale;
              const centerY = (c.viewportH / 2 - c.panY) / c.scale;
              scale = c.scale * Math.min(widthRatio, heightRatio);
              panX = window.innerWidth / 2 - centerX * scale;
              panY = window.innerHeight / 2 - centerY * scale;
              return true;
            }
          }
        }
      } catch(e) {}
      panX = window.innerWidth / 2;
      panY = window.innerHeight / 2;
      scale = 0.55;
      return false;
    }

    function openingCamera() {
      if (!currentItems.length) return null;
      const lead = currentItems.find(item => item.type === 'video') || currentItems[0];
      const leadCard = Array.from(world.querySelectorAll('.media-card')).find(card => card.dataset.id === lead.id);
      const isSmall = window.innerWidth < 700;
      const openingScale = isSmall ? Math.min(1, Math.max(0.66, window.innerWidth / 560))
        : Math.min(1.12, Math.max(0.7, window.innerWidth / 1100));
      const focusX = Number(leadCard?.dataset.x ?? lead.x) || 0;
      const focusY = Number(leadCard?.dataset.y ?? lead.y) || 0;
      return {
        scale: openingScale,
        panX: window.innerWidth * (isSmall ? 0.5 : 0.34) - focusX * openingScale,
        panY: window.innerHeight * 0.5 - focusY * openingScale
      };
    }

    function focusOpeningFrame() {
      const camera = openingCamera();
      if (!camera) return;
      ({ panX, panY, scale } = camera);
      updateCamera();
      saveCamera();
    }

    function resetView() {
      const camera = openingCamera();
      if (camera) animateCamera(camera.panX, camera.panY, camera.scale, 400);
      showToast('View Reset');
    }

    function animateCamera(targetPanX, targetPanY, targetScale, duration = 400) {
      const startX = panX;
      const startY = panY;
      const startS = scale;
      const startTime = performance.now();

      function stepAnim(now) {
        const progress = Math.min(1, (now - startTime) / duration);
        const ease = 1 - Math.pow(1 - progress, 3); // cubic ease-out

        panX = startX + (targetPanX - startX) * ease;
        panY = startY + (targetPanY - startY) * ease;
        scale = startS + (targetScale - startS) * ease;
        updateCamera();

        if (progress < 1) {
          requestAnimationFrame(stepAnim);
        } else {
          saveCamera();
        }
      }
      requestAnimationFrame(stepAnim);
    }

    function zoomToFitAll() {
      const cards = document.querySelectorAll('.media-card');
      if (cards.length === 0) {
        resetView();
        return;
      }

      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      cards.forEach(card => {
        const x = parseFloat(card.dataset.x);
        const y = parseFloat(card.dataset.y);
        const w = parseFloat(card.dataset.w || 300);
        const h = parseFloat(card.dataset.h || 200);

        minX = Math.min(minX, x - w/2);
        maxX = Math.max(maxX, x + w/2);
        minY = Math.min(minY, y - h/2);
        maxY = Math.max(maxY, y + h/2);
      });

      const totalW = Math.max(100, maxX - minX + 200);
      const totalH = Math.max(100, maxY - minY + 200);
      const midX = (minX + maxX) / 2;
      const midY = (minY + maxY) / 2;

      const scaleX = window.innerWidth / totalW;
      const scaleY = window.innerHeight / totalH;
      const fitScale = Math.min(Math.max(Math.min(scaleX, scaleY), 0.12), 1.2);

      const targetPanX = window.innerWidth / 2 - midX * fitScale;
      const targetPanY = window.innerHeight / 2 - midY * fitScale;

      animateCamera(targetPanX, targetPanY, fitScale, 450);
      showToast('Fitted all media on board');
    }

    function jumpToMediaCard(id) {
      const card = world.querySelector(`.media-card[data-id="${id}"]`);
      if (!card) return;

      const cardX = parseFloat(card.dataset.x);
      const cardY = parseFloat(card.dataset.y);
      const targetScale = 0.85;
      const targetPanX = window.innerWidth / 2 - cardX * targetScale;
      const targetPanY = window.innerHeight / 2 - cardY * targetScale;

      highestZ += 5;
      card.style.zIndex = highestZ;

      animateCamera(targetPanX, targetPanY, targetScale, 400);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        showToast('Fullscreen Enabled');
      } else {
        document.exitFullscreen().catch(() => {});
        showToast('Fullscreen Exited');
      }
    }

    // Wheel & Trackpad
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.ctrlKey) {
        // Pinch zoom
        const zoomFactor = Math.exp(-e.deltaY * 0.01);
        const mouseX = e.clientX;
        const mouseY = e.clientY;
        const newScale = Math.min(Math.max(scale * zoomFactor, 0.12), 2.5);
        panX = mouseX - (mouseX - panX) * (newScale / scale);
        panY = mouseY - (mouseY - panY) * (newScale / scale);
        scale = newScale;
      } else {
        // Trackpad pan
        panX -= e.deltaX;
        panY -= e.deltaY;
      }
      updateCamera();
      saveCamera();
    }, { passive: false });

    // Canvas Navigation (Middle Mouse Button Drag) & Marquee Rubber-Band Selection (Left Button Drag)
    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('#command-backdrop') || isCommandBarOpen) return;

      // 1. Middle Mouse Button (button 1) -> Pan Canvas on Windows/desktop mice
      if (e.button === 1) {
        e.preventDefault();
        isMiddlePanning = true;
        startMouseX = e.clientX - panX;
        startMouseY = e.clientY - panY;
        document.body.classList.add('middle-panning');
        return;
      }

      // 2. Left Mouse Button (button 0) on canvas background -> Rubber-band Marquee Selection
      if (e.button === 0 && !e.target.closest('.media-card')) {
        marqueeStartX = e.clientX;
        marqueeStartY = e.clientY;
        isMarqueeSelecting = false;
        marqueeAdditive = e.shiftKey || e.metaKey || e.ctrlKey;
        marqueeBaseSelection = new Set(selectedCardIds);
        if (!marqueeAdditive) {
          selectCard(null);
        }
      }
    });

    window.addEventListener('auxclick', (e) => {
      if (e.button === 1) e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      // Middle Mouse Panning
      if (isMiddlePanning) {
        panX = e.clientX - startMouseX;
        panY = e.clientY - startMouseY;
        updateCamera();
        return;
      }

      // Touch / compatibility panning fallback
      if (isPanning) {
        panX = e.clientX - startMouseX;
        panY = e.clientY - startMouseY;
        updateCamera();
        return;
      }

      // Marquee Selection Drag
      if (marqueeStartX !== null && !activeCard) {
        const dx = e.clientX - marqueeStartX;
        const dy = e.clientY - marqueeStartY;
        if (!isMarqueeSelecting && Math.hypot(dx, dy) > 4) {
          isMarqueeSelecting = true;
        }

        if (isMarqueeSelecting) {
          const left = Math.min(marqueeStartX, e.clientX);
          const top = Math.min(marqueeStartY, e.clientY);
          const width = Math.abs(dx);
          const height = Math.abs(dy);
          const right = left + width;
          const bottom = top + height;

          const marqueeEl = document.getElementById('selection-marquee');
          if (marqueeEl) {
            marqueeEl.style.left = `${left}px`;
            marqueeEl.style.top = `${top}px`;
            marqueeEl.style.width = `${width}px`;
            marqueeEl.style.height = `${height}px`;
            marqueeEl.style.display = 'block';
          }

          const intersecting = new Set();
          const cards = Array.from(world.querySelectorAll('.media-card[data-id]'));
          cards.forEach(card => {
            const rect = card.getBoundingClientRect();
            const intersects = !(rect.right < left || rect.left > right || rect.bottom < top || rect.top > bottom);
            if (intersects) {
              intersecting.add(card.dataset.id);
            }
          });

          selectedCardIds.clear();
          if (marqueeAdditive) {
            marqueeBaseSelection.forEach(id => selectedCardIds.add(id));
            intersecting.forEach(id => selectedCardIds.add(id));
          } else {
            intersecting.forEach(id => selectedCardIds.add(id));
          }

          selectedCardId = selectedCardIds.values().next().value || null;
          cards.forEach(card => {
            card.classList.toggle('is-selected', selectedCardIds.has(card.dataset.id));
          });
        }
      }
    });

    window.addEventListener('mouseup', (e) => {
      // Middle Mouse Panning End
      if (isMiddlePanning) {
        isMiddlePanning = false;
        document.body.classList.remove('middle-panning');
        saveCamera();
      }

      if (isPanning) {
        isPanning = false;
        document.body.classList.remove('panning');
        saveCamera();
      }

      // Marquee Selection End
      if (marqueeStartX !== null) {
        const marqueeEl = document.getElementById('selection-marquee');
        if (marqueeEl) marqueeEl.style.display = 'none';

        if (!isMarqueeSelecting && !e.target.closest('.media-card') && !e.target.closest('#command-backdrop') && !isCommandBarOpen) {
          // Single click on empty canvas with no drag
          selectCard(null);
          closeAllFolders();
        }
        marqueeStartX = null;
        marqueeStartY = null;
        isMarqueeSelecting = false;
      }
    });

    // Global click-outside listener to close open decks when clicking anywhere else
    window.addEventListener('click', (e) => {
      if (dragMoved || isMarqueeSelecting) return;
      if (e.target.closest('.media-card') || e.target.closest('#command-bar') || e.target.closest('#command-backdrop') || e.target.closest('#lightbox')) return;
      closeAllFolders();
    });

    // Touch keeps the canvas free of permanent controls: drag to move, pinch to zoom,
    // double tap a card to open it, and hold to reveal the command palette.
    let touchStart = null;
    let touchHoldTimer = null;
    let pinchStart = null;
    let lastCardTap = null;
    viewport.addEventListener('touchstart', (e) => {
      if (isCommandBarOpen) return;
      e.preventDefault();
      clearTimeout(touchHoldTimer);
      if (e.touches.length === 2) {
        if (activeCard) onCardMouseUp();
        isPanning = false;
        const a = e.touches[0], b = e.touches[1];
        const midX = (a.clientX + b.clientX) / 2;
        const midY = (a.clientY + b.clientY) / 2;
        pinchStart = {
          distance: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
          scale, worldX: (midX - panX) / scale, worldY: (midY - panY) / scale
        };
        touchStart = null;
        return;
      }
      const point = e.touches[0];
      const card = e.target.closest('.media-card');
      selectCard(card || null);
      const now = Date.now();
      if (card && lastCardTap && lastCardTap.id === card.dataset.id && now - lastCardTap.time < 340) {
        clearTimeout(folderClickTimer);
        const item = currentItems.find(entry => entry.id === card.dataset.id);
        if (item) openLightbox(item);
        lastCardTap = null;
        return;
      }
      touchStart = { x: point.clientX, y: point.clientY, card, moved: false };
      if (card) {
        onCardMouseDown({ button: 0, clientX: point.clientX, clientY: point.clientY, stopPropagation() {} }, card);
      } else {
        isPanning = true;
        startMouseX = point.clientX - panX;
        startMouseY = point.clientY - panY;
      }
      touchHoldTimer = setTimeout(() => {
        if (!touchStart || touchStart.moved) return;
        if (activeCard) onCardMouseUp();
        isPanning = false;
        touchStart = null;
        openCommandBar();
      }, 620);
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (pinchStart && e.touches.length === 2) {
        const a = e.touches[0], b = e.touches[1];
        const distance = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        const midX = (a.clientX + b.clientX) / 2;
        const midY = (a.clientY + b.clientY) / 2;
        scale = Math.min(2.5, Math.max(0.12, pinchStart.scale * distance / pinchStart.distance));
        panX = midX - pinchStart.worldX * scale;
        panY = midY - pinchStart.worldY * scale;
        updateCamera();
        return;
      }
      if (!touchStart || !e.touches.length) return;
      const point = e.touches[0];
      if (Math.hypot(point.clientX - touchStart.x, point.clientY - touchStart.y) > 8) {
        touchStart.moved = true;
        clearTimeout(touchHoldTimer);
      }
      if (activeCard) onCardMouseMove(point);
      else if (isPanning) {
        panX = point.clientX - startMouseX;
        panY = point.clientY - startMouseY;
        updateCamera();
      }
    }, { passive: false });

    viewport.addEventListener('touchend', () => {
      clearTimeout(touchHoldTimer);
      if (pinchStart) {
        pinchStart = null;
        saveCamera();
      }
      if (touchStart && !touchStart.moved) {
        if (touchStart.card) {
          lastCardTap = { id: touchStart.card.dataset.id, time: Date.now() };
          const tappedCard = touchStart.card;
          const rootId = folderRootId(tappedCard);
          if (folderCards(rootId).length > 1) {
            clearTimeout(folderClickTimer);
            folderClickTimer = setTimeout(() => {
              closeAllFolders(rootId);
              toggleFolder(rootId);
            }, 350);
          } else {
            closeAllFolders();
          }
        } else {
          selectCard(null);
          closeAllFolders();
        }
      }
      if (activeCard) onCardMouseUp();
      if (isPanning) saveCamera();
      isPanning = false;
      touchStart = null;
    });

    // ============================================================
    // MEDIA CARD GENERATION & DRAG FLING PHYSICS
    // ============================================================

    function getCard(id) {
      return Array.from(world.querySelectorAll('.media-card[data-id]')).find(card => card.dataset.id === id) || null;
    }

    function folderRootId(card) {
      return card?.dataset.folderId || card?.dataset.id || null;
    }

    function folderCards(rootId) {
      const root = getCard(rootId);
      if (!root) return [];
      const children = Array.from(world.querySelectorAll('.media-card[data-folder-id]'))
        .filter(card => card.dataset.folderId === rootId)
        .sort((a, b) => Number(a.style.zIndex) - Number(b.style.zIndex));
      return [root, ...children];
    }

    function setCardPose(card, x, y, rot, dragScale = 1) {
      card.style.transform = `translate3d(${x - Number(card.dataset.w) / 2}px, ${y - Number(card.dataset.h) / 2}px, 0) rotate(${rot}deg) scale(${dragScale})`;
    }

    function calculateFolderFanLayout(sizes, bounds, anchorX, anchorY, cameraScale) {
      const availableWidth = Math.max(1, bounds.right - bounds.left);
      const availableHeight = Math.max(1, bounds.bottom - bounds.top);
      const gap = 26 / Math.max(0.12, cameraScale);
      const boxes = sizes.map((size, index) => ({
        index,
        // Rotation needs breathing room, especially beside a wide video.
        width: size.w + size.h * 0.16 + gap,
        height: size.h + size.w * 0.16 + gap
      }));
      const area = boxes.reduce((sum, box) => sum + box.width * box.height, 0);
      const widest = Math.max(...boxes.map(box => box.width));
      const rowLimit = Math.max(widest, Math.min(availableWidth, Math.sqrt(area * availableWidth / availableHeight) * 1.08));
      const rows = [];
      boxes.forEach(box => {
        let row = rows[rows.length - 1];
        if (!row || (row.boxes.length && row.width + box.width > rowLimit)) {
          row = { boxes: [], width: 0, height: 0 };
          rows.push(row);
        }
        row.boxes.push(box);
        row.width += box.width;
        row.height = Math.max(row.height, box.height);
      });
      const layoutWidth = Math.max(...rows.map(row => row.width));
      const layoutHeight = rows.reduce((sum, row) => sum + row.height, 0);
      const fit = Math.min(1, availableWidth / layoutWidth, availableHeight / layoutHeight);
      const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
      const centerX = clamp(anchorX, bounds.left + layoutWidth * fit / 2, bounds.right - layoutWidth * fit / 2);
      const centerY = clamp(anchorY, bounds.top + layoutHeight * fit / 2, bounds.bottom - layoutHeight * fit / 2);
      const poses = Array(sizes.length);
      let rowTop = -layoutHeight / 2;
      rows.forEach(row => {
        let left = -row.width / 2;
        row.boxes.forEach(box => {
          const horizontal = left + box.width / 2;
          poses[box.index] = {
            x: centerX + horizontal * fit,
            y: centerY + (rowTop + row.height / 2) * fit,
            rot: clamp(horizontal / Math.max(row.width, 1) * 9, -5, 5),
            scale: fit,
            width: box.width * fit,
            height: box.height * fit
          };
          left += box.width;
        });
        rowTop += row.height;
      });
      return poses;
    }

    const STACK_ROTATIONS = [0, -3.5, 2.8, -1.8, 3.6, -2.5, 1.6, -4.0, 2.2, -1.4];
    function getStackCardRotation(index, total) {
      if (total <= 1 || index === 0) return 0;
      return STACK_ROTATIONS[index % STACK_ROTATIONS.length] || (index % 2 === 1 ? -3 : 3);
    }

    function layoutFolder(rootId) {
      const cards = folderCards(rootId);
      if (!cards.length) return;
      const root = cards[0];
      const x = Number(root.dataset.x), y = Number(root.dataset.y);
      const expanded = expandedFolders.has(rootId) && cards.length > 1;
      const margin = 32;
      const fan = expanded ? calculateFolderFanLayout(
        cards.map(card => ({ w: Number(card.dataset.w), h: Number(card.dataset.h) })),
        {
          left: (margin - panX) / scale,
          right: (window.innerWidth - margin - panX) / scale,
          top: (margin - panY) / scale,
          bottom: (window.innerHeight - margin - panY) / scale
        }, x, y, scale
      ) : null;
      cards.forEach((card, index) => {
        card.classList.toggle('folder-member', cards.length > 1);
        if (cards.length > 1) card.setAttribute('aria-expanded', String(expanded));
        else card.removeAttribute('aria-expanded');
        card.setAttribute('aria-label', cards.length > 1
          ? `${card.dataset.title || 'Media'} in folder of ${cards.length}. Click to ${expanded ? 'close' : 'spread'}, double click to open.`
          : `Open ${card.dataset.title || 'media item'}`);
        if (card === activeCard || (draggedGroupCards && draggedGroupCards.some(e => e.card === card))) return;
        if (expanded) {
          const pose = fan[index];
          card.dataset.rot = pose.rot;
          setCardPose(card, pose.x, pose.y, pose.rot, pose.scale);
        } else {
          const rot = getStackCardRotation(index, cards.length);
          card.dataset.rot = rot;
          setCardPose(card, x, y, rot);
        }
      });
    }

    function closeAllFolders(exceptRootId = null) {
      if (!expandedFolders.size) return;
      const toClose = [];
      expandedFolders.forEach(rootId => {
        if (rootId !== exceptRootId) toClose.push(rootId);
      });
      toClose.forEach(rootId => {
        expandedFolders.delete(rootId);
        layoutFolder(rootId);
      });
    }

    function layoutAllFolders() {
      const roots = new Set(Array.from(world.querySelectorAll('.media-card[data-folder-id]')).map(card => card.dataset.folderId));
      roots.forEach(layoutFolder);
    }

    window.addEventListener('resize', () => {
      if (expandedFolders.size) expandedFolders.forEach(layoutFolder);
    });

    function toggleFolder(rootId) {
      if (folderCards(rootId).length < 2) return;
      if (expandedFolders.has(rootId)) {
        expandedFolders.delete(rootId);
      } else {
        closeAllFolders(rootId);
        expandedFolders.add(rootId);
      }
      layoutFolder(rootId);
    }

    function toggleSelectedFolder() {
      const targetId = selectedCardId || (selectedCardIds.size > 0 ? selectedCardIds.values().next().value : null);
      if (!targetId) { showToast('Select a folder first'); return; }
      const rootId = folderRootId(getCard(targetId));
      if (folderCards(rootId).length < 2) { showToast('Selected card is not a folder'); return; }
      toggleFolder(rootId);
    }

    function stackSelectedWithNearest() {
      finishPendingFling();
      const targetId = selectedCardId || (selectedCardIds.size > 0 ? selectedCardIds.values().next().value : null);
      if (!targetId) { showToast('Select a card first'); return; }
      const source = getCard(folderRootId(getCard(targetId)));
      if (!source) { showToast('Select a card first'); return; }
      const nearby = Array.from(world.querySelectorAll('.media-card[data-id]'))
        .filter(card => folderRootId(card) !== source.dataset.id)
        .map(card => getCard(folderRootId(card)))
        .filter((card, index, cards) => card && cards.indexOf(card) === index)
        .sort((a, b) => {
          const distanceA = Math.hypot(Number(a.dataset.x) - Number(source.dataset.x), Number(a.dataset.y) - Number(source.dataset.y));
          const distanceB = Math.hypot(Number(b.dataset.x) - Number(source.dataset.x), Number(b.dataset.y) - Number(source.dataset.y));
          return distanceA - distanceB;
        });
      if (!nearby.length) { showToast('Add another card to make a folder'); return; }
      attachToFolder(source, nearby[0]);
    }

    function groupSelectedCards() {
      finishPendingFling();
      const cards = getSelectedCards();
      if (cards.length < 2) {
        if (cards.length === 1 || selectedCardId) {
          stackSelectedWithNearest();
          return;
        }
        showToast('Select multiple media cards to group');
        return;
      }
      const before = captureBoardSnapshot();
      // Calculate centroid of selected cards
      const avgX = cards.reduce((sum, c) => sum + Number(c.dataset.x), 0) / cards.length;
      const avgY = cards.reduce((sum, c) => sum + Number(c.dataset.y), 0) / cards.length;

      const root = cards[0];
      const rootId = root.dataset.id;
      delete root.dataset.folderId;
      root.classList.remove('folder-member');
      root.dataset.x = avgX;
      root.dataset.y = avgY;
      root.style.zIndex = ++highestZ;

      cards.slice(1).forEach(card => {
        card.dataset.folderId = rootId;
        card.dataset.x = avgX;
        card.dataset.y = avgY;
        card.classList.add('folder-member');
        card.style.zIndex = ++highestZ;
      });

      expandedFolders.delete(rootId);
      layoutFolder(rootId);
      selectCard(root);
      savePositions(true);
      recordBoardChange(before);
      showToast(`Group created · ${cards.length} media`);
    }

    function rearrangeSelectedGrid() {
      finishPendingFling();
      const cards = getSelectedCards();
      if (cards.length === 0) {
        showToast('Select media items first');
        return;
      }
      if (cards.length === 1) {
        autoArrangeGrid();
        return;
      }
      const before = captureBoardSnapshot();
      // Calculate centroid
      const avgX = cards.reduce((sum, c) => sum + Number(c.dataset.x), 0) / cards.length;
      const avgY = cards.reduce((sum, c) => sum + Number(c.dataset.y), 0) / cards.length;

      // Unpack from any folders
      cards.forEach(card => {
        delete card.dataset.folderId;
        card.classList.remove('folder-member');
        expandedFolders.delete(card.dataset.id);
      });

      const cols = Math.ceil(Math.sqrt(cards.length * 1.3));
      const colWidth = 380;
      const rowHeight = 300;
      const startX = avgX - ((cols - 1) * colWidth) / 2;
      const startY = avgY - ((Math.ceil(cards.length / cols) - 1) * rowHeight) / 2;

      cards.forEach((card, idx) => {
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        const targetX = startX + c * colWidth;
        const targetY = startY + r * rowHeight;
        const rot = (idx % 2 === 0 ? 0.5 : -0.5);

        card.dataset.x = targetX;
        card.dataset.y = targetY;
        card.dataset.rot = rot;
        setCardPose(card, targetX, targetY, rot);
      });

      layoutAllFolders();
      savePositions(true);
      recordBoardChange(before);
      showToast(`Rearranged ${cards.length} items in grid`);
    }

    function ungroupSelected() {
      finishPendingFling();
      const cards = getSelectedCards();
      if (!cards.length && selectedCardId) {
        const rootId = folderRootId(getCard(selectedCardId));
        if (folderCards(rootId).length > 1) {
          cards.push(...folderCards(rootId));
        }
      }
      if (!cards.length) {
        showToast('Select a group to ungroup');
        return;
      }
      const before = captureBoardSnapshot();
      const rootsToUnpack = new Set();
      cards.forEach(card => {
        const rootId = folderRootId(card);
        if (folderCards(rootId).length > 1) {
          rootsToUnpack.add(rootId);
        }
      });

      if (!rootsToUnpack.size) {
        showToast('No grouped folders in selection');
        return;
      }

      rootsToUnpack.forEach(rootId => {
        const members = folderCards(rootId);
        expandedFolders.delete(rootId);
        members.forEach((card, index) => {
          delete card.dataset.folderId;
          card.classList.remove('folder-member');
          const offsetX = (index - (members.length - 1) / 2) * 85;
          const offsetY = (index % 2 === 0 ? 35 : -35);
          const newX = Number(card.dataset.x) + offsetX;
          const newY = Number(card.dataset.y) + offsetY;
          card.dataset.x = newX;
          card.dataset.y = newY;
          setCardPose(card, newX, newY, Number(card.dataset.rot || 0));
        });
      });

      layoutAllFolders();
      savePositions(true);
      recordBoardChange(before);
      showToast('Ungrouped selection');
    }

    function clearFolderHover() {
      if (folderHoverTimer) clearTimeout(folderHoverTimer);
      folderHoverTimer = null;
      folderHoverTarget?.classList.remove('folder-drop-target');
      folderHoverTarget = null;
    }

    function findFolderDropTarget(source, clientX, clientY) {
      const sourceRoot = folderRootId(source);
      const sourceRect = source.getBoundingClientRect();
      const movingIds = new Set((draggedGroupCards && draggedGroupCards.length > 0) ? draggedGroupCards.map(entry => entry.card.dataset.id) : [source.dataset.id]);
      return Array.from(world.querySelectorAll('.media-card[data-id]'))
        .filter(card => card !== source && folderRootId(card) !== sourceRoot && !movingIds.has(card.dataset.id) && !card.classList.contains('placeholder-card'))
        .filter(card => {
          const rect = card.getBoundingClientRect();
          const pointerInside = clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom;
          const overlapWidth = Math.max(0, Math.min(rect.right, sourceRect.right) - Math.max(rect.left, sourceRect.left));
          const overlapHeight = Math.max(0, Math.min(rect.bottom, sourceRect.bottom) - Math.max(rect.top, sourceRect.top));
          const smallerArea = Math.min(rect.width * rect.height, sourceRect.width * sourceRect.height);
          return pointerInside || (smallerArea > 0 && overlapWidth * overlapHeight > smallerArea * 0.25);
        })
        .sort((a, b) => Number(b.style.zIndex) - Number(a.style.zIndex))[0] || null;
    }

    function attachToFolder(source, target) {
      if (!source || !target) return;
      const targetRootId = folderRootId(target);
      const targetRoot = getCard(targetRootId);
      const sourceRootId = folderRootId(source);
      if (!targetRoot || sourceRootId === targetRootId) return;
      const before = dragStartSnapshot || captureBoardSnapshot();

      const movingGroup = (draggedGroupCards && draggedGroupCards.length > 0)
        ? draggedGroupCards.map(e => e.card)
        : [source];

      const allMovingCards = [];
      movingGroup.forEach(c => {
        const rootId = folderRootId(c);
        folderCards(rootId).forEach(child => {
          if (!allMovingCards.includes(child)) allMovingCards.push(child);
        });
      });

      clearFolderHover();
      window.removeEventListener('mousemove', onCardMouseMove);
      window.removeEventListener('mouseup', onCardMouseUp);
      allMovingCards.forEach(c => c.classList.remove('dragging'));
      activeCard = null;
      draggedGroupCards = [];

      allMovingCards.forEach(card => card.classList.add('folder-member'));
      void source.offsetWidth;
      allMovingCards.forEach(card => {
        card.dataset.folderId = targetRootId;
        card.dataset.x = targetRoot.dataset.x;
        card.dataset.y = targetRoot.dataset.y;
        card.style.zIndex = ++highestZ;
      });
      expandedFolders.delete(sourceRootId);
      expandedFolders.delete(targetRootId);
      layoutFolder(targetRootId);
      selectCard(source);
      savePositions(true);
      recordBoardChange(before);
      dragStartSnapshot = null;
      showToast(`Folder updated · ${folderCards(targetRootId).length} media`);
    }

    function updateFolderHover(clientX, clientY) {
      if (!activeCard || !dragMoved) return;
      const target = findFolderDropTarget(activeCard, clientX, clientY);
      const targetRoot = target ? getCard(folderRootId(target)) : null;
      if (targetRoot === folderHoverTarget) return;
      clearFolderHover();
      if (!targetRoot) return;
      folderHoverTarget = targetRoot;
      targetRoot.classList.add('folder-drop-target');
      const source = activeCard;
      folderHoverTimer = setTimeout(() => {
        if (activeCard === source && folderHoverTarget === targetRoot) attachToFolder(source, targetRoot);
      }, 1500);
    }

    // ============================================================
    // CARD RESIZE SYSTEM (Zero-UI Subtle Affordance & Aspect Snap)
    // ============================================================

    let isResizingCard = false;
    let resizingCard = null;
    let activeHandleType = null;
    let resizeStartClientX = 0;
    let resizeStartClientY = 0;
    let resizeStartSnapshot = null;
    let primaryResizeEntry = null;
    let resizingGroupEntries = [];
    let wasSnapped = false;

    function getAspectSnapTargets(card) {
      const targets = [];
      let natural = null;
      if (card && card.dataset && card.dataset.naturalAspect) {
        natural = Number(card.dataset.naturalAspect);
      } else {
        const curW = Number(card.dataset.w || 320);
        const curH = Number(card.dataset.h || 240);
        natural = curW / Math.max(1, curH);
      }

      if (natural && natural > 0.1 && !isNaN(natural)) {
        targets.push({ ratio: natural, label: 'ORIGINAL' });
      }

      const standards = [
        { ratio: 16 / 9, label: '16:9' },
        { ratio: 4 / 3, label: '4:3' },
        { ratio: 1 / 1, label: '1:1' },
        { ratio: 3 / 2, label: '3:2' },
        { ratio: 2 / 3, label: '2:3' },
        { ratio: 9 / 16, label: '9:16' },
        { ratio: 2.39, label: '2.39:1' },
        { ratio: 4 / 5, label: '4:5' }
      ];

      standards.forEach(std => {
        if (!targets.some(t => Math.abs(t.ratio - std.ratio) / std.ratio < 0.015)) {
          targets.push(std);
        }
      });

      return targets;
    }

    function onCardResizeMouseDown(e, card, handleType) {
      if (e.button !== 0 || isCommandBarOpen) return;
      e.stopPropagation();
      e.preventDefault();

      finishPendingFling();
      clearFolderHover();
      clearTimeout(folderClickTimer);

      if (!selectedCardIds.has(card.dataset.id)) {
        selectCard(card, 'replace');
      }

      isResizingCard = true;
      resizingCard = card;
      activeHandleType = handleType;
      resizeStartClientX = e.clientX;
      resizeStartClientY = e.clientY;
      resizeStartSnapshot = captureBoardSnapshot();
      wasSnapped = false;

      const targetCards = (selectedCardIds.has(card.dataset.id) && selectedCardIds.size > 1)
        ? getSelectedCards()
        : [card];

      resizingGroupEntries = targetCards.map(c => ({
        card: c,
        startX: Number(c.dataset.x),
        startY: Number(c.dataset.y),
        startW: Number(c.dataset.w || 320),
        startH: Number(c.dataset.h || 240),
        startRot: Number(c.dataset.rot || 0),
        aspectRatio: Number(c.dataset.w || 320) / Math.max(1, Number(c.dataset.h || 240))
      }));

      primaryResizeEntry = resizingGroupEntries.find(entry => entry.card === card) || resizingGroupEntries[0];

      card.classList.add('is-resizing');
      document.body.classList.add('is-resizing');

      const cursorMap = {
        nw: 'nwse-resize', se: 'nwse-resize',
        ne: 'nesw-resize', sw: 'nesw-resize',
        n: 'ns-resize', s: 'ns-resize',
        e: 'ew-resize', w: 'ew-resize'
      };
      document.body.style.cursor = cursorMap[handleType] || 'default';

      window.addEventListener('mousemove', onCardResizeMouseMove);
      window.addEventListener('mouseup', onCardResizeMouseUp);
    }

    function onCardResizeMouseMove(e) {
      if (!isResizingCard || !resizingCard || !primaryResizeEntry) return;

      const currentMouseWorldX = (e.clientX - panX) / scale;
      const currentMouseWorldY = (e.clientY - panY) / scale;
      const startMouseWorldX = (resizeStartClientX - panX) / scale;
      const startMouseWorldY = (resizeStartClientY - panY) / scale;

      const deltaWorldX = currentMouseWorldX - startMouseWorldX;
      const deltaWorldY = currentMouseWorldY - startMouseWorldY;

      const { startW, startH, startX, startY, startRot, aspectRatio } = primaryResizeEntry;
      const rad = (startRot * Math.PI) / 180;
      const cos = Math.cos(rad);
      const sin = Math.sin(rad);

      // Rotate delta into local coordinate space of the card
      const localDeltaX = deltaWorldX * cos + deltaWorldY * sin;
      const localDeltaY = -deltaWorldX * sin + deltaWorldY * cos;

      let dw = 0;
      let dh = 0;
      let pinDirectionX = 0; // -1 for left handles, +1 for right handles
      let pinDirectionY = 0; // -1 for top handles, +1 for bottom handles

      switch (activeHandleType) {
        case 'se':
          dw = localDeltaX;
          dh = localDeltaY;
          pinDirectionX = 1;
          pinDirectionY = 1;
          break;
        case 'nw':
          dw = -localDeltaX;
          dh = -localDeltaY;
          pinDirectionX = -1;
          pinDirectionY = -1;
          break;
        case 'ne':
          dw = localDeltaX;
          dh = -localDeltaY;
          pinDirectionX = 1;
          pinDirectionY = -1;
          break;
        case 'sw':
          dw = -localDeltaX;
          dh = localDeltaY;
          pinDirectionX = -1;
          pinDirectionY = 1;
          break;
        case 'e':
          dw = localDeltaX;
          dh = 0;
          pinDirectionX = 1;
          pinDirectionY = 0;
          break;
        case 'w':
          dw = -localDeltaX;
          dh = 0;
          pinDirectionX = -1;
          pinDirectionY = 0;
          break;
        case 's':
          dw = 0;
          dh = localDeltaY;
          pinDirectionX = 0;
          pinDirectionY = 1;
          break;
        case 'n':
          dw = 0;
          dh = -localDeltaY;
          pinDirectionX = 0;
          pinDirectionY = -1;
          break;
      }

      const isCorner = ['se', 'nw', 'ne', 'sw'].includes(activeHandleType);
      const keepAspect = isCorner ? !e.shiftKey : e.shiftKey;

      let newW = startW + dw;
      let newH = startH + dh;

      if (keepAspect) {
        if (isCorner) {
          const scaleX = (startW + dw) / Math.max(1, startW);
          const scaleY = (startH + dh) / Math.max(1, startH);
          const uniformScale = Math.max(0.08, (scaleX + scaleY) / 2);
          newW = Math.max(100, Math.min(3200, startW * uniformScale));
          newH = Math.max(80, Math.min(3200, newW / aspectRatio));
        } else if (pinDirectionX !== 0) {
          newW = Math.max(100, Math.min(3200, newW));
          newH = Math.max(80, Math.min(3200, newW / aspectRatio));
        } else if (pinDirectionY !== 0) {
          newH = Math.max(80, Math.min(3200, newH));
          newW = Math.max(100, Math.min(3200, newH * aspectRatio));
        }
      } else {
        newW = Math.max(100, Math.min(3200, newW));
        newH = Math.max(80, Math.min(3200, newH));
      }

      // Aspect Ratio Snapping with Magnetic Threshold & Glow
      let snappedTarget = null;
      const snapTargets = getAspectSnapTargets(resizingCard);
      const snapDistanceThreshold = 14;

      for (const target of snapTargets) {
        const expectedH = newW / target.ratio;
        const expectedW = newH * target.ratio;
        const currentRatio = newW / Math.max(1, newH);
        const ratioDiff = Math.abs(currentRatio - target.ratio) / target.ratio;

        if (Math.abs(newH - expectedH) <= snapDistanceThreshold || Math.abs(newW - expectedW) <= snapDistanceThreshold || ratioDiff <= 0.035) {
          snappedTarget = target;
          if (pinDirectionX !== 0 && pinDirectionY === 0) {
            newW = Math.max(100, Math.min(3200, newH * target.ratio));
          } else {
            newH = Math.max(80, Math.min(3200, newW / target.ratio));
          }
          break;
        }
      }

      const isSnapped = Boolean(snappedTarget);
      if (isSnapped !== wasSnapped) {
        if (isSnapped && typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate(6); } catch (e) {}
        }
        wasSnapped = isSnapped;
      }

      resizingCard.classList.toggle('is-aspect-snapped', isSnapped);
